                goal: Talk about your plans and hopes for the next few years.

      - id: quand-j-etais-petit
        title: When I Was a Child
        description: Describe your childhood, past habits and how things used to be.
        icon: 🧸
        steps:
          - id: imparfait-formation
            title: The Imperfect Tense
            description: Form the imparfait from the nous form of the present.
            vocabulary: ["je jouais", "tu habitais", "il mangeait", "nous allions", "vous aviez", "ils finissaient", "l'enfance", "petit", "petite"]
            grammar:
              - pattern: "Quand j'étais petit, je jouais au foot."
              - pattern: "Nous habitions à la campagne."
              - pattern: "Mes parents travaillaient beaucoup."
            activities:
              - { type: learn, count: 3 }
              - { type: fill_blank, count: 2 }
              - { type: word_select, count: 2 }
              - { type: listen_select, count: 2 }
          - id: imparfait-etre
            title: I Was
            description: Use the irregular stem ét- to describe people and places in the past.
            vocabulary: ["j'étais", "tu étais", "il était", "nous étions", "vous étiez", "ils étaient", timide, sage, bavard]
            grammar:
              - pattern: "J'étais très timide à l'école."
              - pattern: "Notre maison était petite mais jolie."
              - pattern: "Vous étiez où pendant les vacances ?"
            activities:
              - { type: learn, count: 2 }
              - { type: multiple_choice, count: 2 }
              - { type: error_correct }
              - { type: translate, count: 2 }
          - id: imparfait-habitudes
            title: Used To
            description: Describe repeated habits in the past.
            vocabulary: [avant, "d'habitude", "tous les étés", "chaque dimanche", "le mercredi", "à l'époque", "en ce temps-là", "chez mes grands-parents"]
            grammar:
              - pattern: "Avant, je me levais à sept heures."
              - pattern: "Tous les étés, nous allions chez mes grands-parents."
              - pattern: "D'habitude, ma mère préparait des crêpes le dimanche."
            activities:
              - { type: learn, count: 2 }
              - { type: word_bank, count: 2 }
              - { type: sentence_complete, count: 2 }
              - { type: listen_type }
          - id: decrire-le-passe
            title: How It Used to Be
            description: Describe scenes and the weather in the past with il y avait and il faisait.
            vocabulary: ["il y avait", "il faisait beau", "il faisait froid", "il pleuvait", "le village", "la cour de récréation", "le jardin", "le voisin"]
            grammar:
              - pattern: "Il y avait un grand jardin derrière la maison."
              - pattern: "En hiver, il faisait très froid."
              - pattern: "Dans mon village, il n'y avait pas de cinéma."
            activities:
              - { type: learn }
              - { type: fill_blank, count: 2 }
              - { type: error_correct }
              - type: dialogue
                scenario: childhood_memories
                goal: Describe where you lived as a child and what you used to do.

      - id: raconter-des-histoires
        title: Telling Stories
        description: Tell stories by combining the passé composé and the imparfait.
        icon: 📖
        steps:
          - id: passe-compose-ou-imparfait
            title: Which Past Tense?
            description: Use the imparfait for background and the passé composé for events.
            vocabulary: ["un jour", hier, "ce matin-là", "la veille", "le lendemain", "à ce moment-là", "pendant", "il était une fois"]
            grammar:
              - pattern: "Il faisait beau, alors nous sommes allés au parc."
              - pattern: "J'étais fatiguée, donc je suis rentrée tôt."
              - pattern: "Il était une fois une petite fille qui habitait dans la forêt."
            activities:
              - { type: learn, count: 3 }
              - { type: multiple_choice, count: 3 }
              - { type: fill_blank, count: 2 }
              - { type: listen_select, count: 2 }
          - id: action-interrompue
            title: Interrupted Actions
            description: Say what was happening when something else happened.
            vocabulary: [dormir, sonner, arriver, tomber, "prendre une douche", "regarder la télé", "être en train de", quand]
            grammar:
              - pattern: "Je dormais quand le téléphone a sonné."
              - pattern: "Nous regardions la télé quand Paul est arrivé."
              - pattern: "Elle prenait une douche quand on a sonné à la porte."
            activities:
              - { type: learn, count: 2 }
              - { type: word_bank, count: 2 }
              - { type: error_correct, count: 2 }
              - { type: translate }
          - id: connecteurs-recit
            title: Story Connectors
            description: Link the events of a story with time connectors.
            vocabulary: ["d'abord", ensuite, puis, soudain, "tout à coup", "pendant que", "à la fin", finalement, enfin]
            grammar:
              - pattern: "D'abord, j'ai pris le bus, puis j'ai marché jusqu'à la gare."
              - pattern: "Tout à coup, il a commencé à pleuvoir."
              - pattern: "Pendant que je cuisinais, le chat a mangé le poisson."
            activities:
              - { type: learn, count: 2 }
              - { type: sentence_complete, count: 2 }
              - { type: word_select, count: 2 }
              - { type: listen_type }
          - id: raconter-une-histoire
            title: What Happened?
            description: Tell a short story about something unexpected that happened to you.
            vocabulary: ["Qu'est-ce qui s'est passé ?", "Tu ne vas pas me croire !", "heureusement", "malheureusement", "la surprise", "perdre", "retrouver", "avoir peur"]
            grammar:
              - pattern: "Qu'est-ce qui s'est passé ?"
              - pattern: "Je marchais dans la rue quand j'ai vu un vieil ami."
              - pattern: "Heureusement, j'ai retrouvé mon portefeuille."
            activities:
              - { type: learn }
              - { type: fill_blank, count: 2 }
              - { type: speak }
              - type: dialogue
                scenario: telling_a_story
                goal: Tell a friend about something surprising that happened to you last week.

