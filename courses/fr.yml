            vocabulary: ["si … que", "aussi … que", "quelque … que", "pour … que", "tout … que", "quelque peu", "malgré", "néanmoins"]
            grammar:
              - pattern: "Si intelligent qu'il soit, il ne peut pas tout savoir."
              - pattern: "Quelques efforts que nous fassions, le problème persiste."
              - pattern: "Aussi performante que soit cette machine, elle a ses limites."
