              - { type: listen_select, count: 2 }
              - { type: translate, count: 2 }
              - { type: word_select }
          - id: afrique-essencerie-maquis
            title: African French
            description: Discover vocabulary coined in the French of West and Central Africa.
            vocabulary: ["une essencerie", "grever", "un maquis", "cadeauter", "droit-droit", "une go", "un deuxième bureau", "le nouchi"]
            grammar:
