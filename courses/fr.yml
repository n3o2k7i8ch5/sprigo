          - id: bioethique
            title: Bioethics
            description: Debate questions of medical ethics and scientific progress.
            vocabulary: ["la bioéthique", "le clonage", "la fin de vie", "un essai clinique", "le consentement", "la génétique", "les dérives", "un comité d'éthique"]
            grammar:
