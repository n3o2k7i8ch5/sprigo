          - id: demonstratifs-ce-cette
            title: This One, That One
            description: Point to things with ce, cet, cette, ces and -ci / -là.
            vocabulary: [ce, cet, cette, ces, "celui-ci", "celle-là", "la taille", "la couleur", "le pull", "la robe"]
            grammar:
