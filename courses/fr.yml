      - id: maitrise-et-mediation
        title: Mastery & Mediation
        description: Reformulate, interpret, translate and moderate so that others understand each other.
        icon: 🤝
        steps:
          - id: reformuler-en-substance
            title: Summarising & Reformulating
            description: Summarise a text and reformulate it clearly for someone else.
            vocabulary: ["en substance", "autrement dit", "en d'autres termes", "en somme", "l'auteur soutient que", "reformuler", "synthétiser", "l'essentiel"]
            grammar:
              - pattern: "En substance, l'auteur soutient que la croissance n'est pas une fin en soi."
              - pattern: "Autrement dit, il faudrait repenser notre modèle."
              - pattern: "Si je reformule, vous proposez de reporter le projet ?"
            activities:
              - { type: learn, count: 2 }
              - { type: sentence_complete, count: 2 }
              - { type: listen_type, count: 2 }
              - { type: speak }
          - id: sous-entendu-lire-entre-les-lignes
            title: Reading Between the Lines
            description: Explain implicit meaning, insinuations and what is left unsaid.
            vocabulary: ["le sous-entendu", "l'implicite", "lire entre les lignes", "insinuer", "laisser entendre", "une allusion", "à demi-mot", "Suivez mon regard"]
            grammar:
              - pattern: "Quand il dit qu'il est « très pris », il laisse entendre qu'il ne viendra pas."
              - pattern: "Il faut savoir lire entre les lignes."
              - pattern: "Elle me l'a fait comprendre à demi-mot."
            activities:
              - { type: learn, count: 2 }
              - { type: multiple_choice, count: 2 }
              - { type: listen_select, count: 2 }
              - { type: error_correct }
          - id: traduire-expressions-culturelles
            title: Translating Culture
            description: Translate culture-bound expressions by adapting rather than copying them.
            vocabulary: ["l'équivalent", "intraduisible", "le faux ami", "le calque", "l'adaptation", "rendre l'idée", "le contexte culturel", "traduire mot à mot"]
            grammar:
              - pattern: "Il n'existe pas d'équivalent exact ; il faut adapter l'expression."
              - pattern: "Traduire « avoir le cafard » mot à mot n'aurait aucun sens en anglais."
              - pattern: "Traduire, c'est toujours trahir un peu."
            activities:
              - { type: learn, count: 2 }
              - { type: translate, count: 3 }
              - { type: error_correct }
              - { type: match }
          - id: animer-moderer-un-debat
            title: Moderating a Discussion
            description: Chair a discussion, give the floor, refocus and sum up.
            vocabulary: ["Si je peux me permettre", "Pour revenir à", "Résumons", "Je vous laisse la parole", "Laissez-le terminer", "Recentrons le débat", "un tour de table", "le modérateur"]
            grammar:
              - pattern: "Si je peux me permettre, nous nous éloignons du sujet."
              - pattern: "Pour revenir à votre question, deux points méritent d'être soulignés."
              - pattern: "Résumons : deux positions s'opposent, mais un compromis semble possible."
            activities:
              - { type: learn, count: 2 }
              - { type: word_bank, count: 2 }
              - { type: sentence_complete }
              - type: dialogue
                scenario: moderate_panel_discussion
                goal: Moderate a heated panel discussion, giving everyone the floor and summing up the positions fairly.

