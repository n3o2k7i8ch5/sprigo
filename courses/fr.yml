        icon: 💌
        steps:
          - id: pronoms-coi-lui-leur
            title: Calls & Messages
            description: Use the indirect object pronouns lui and leur with phone and message verbs.
            vocabulary: [lui, leur, téléphoner, "envoyer un message", écrire, répondre, "laisser un message", "le portable", "Allô ?"]
            grammar:
              - pattern: "Je lui téléphone ce soir."
              - pattern: "Tu leur as envoyé un message ?"
              - pattern: "Elle ne m'a pas encore répondu."
            activities:
              - { type: learn, count: 3 }
              - { type: word_bank, count: 2 }
              - { type: error_correct, count: 2 }
              - { type: listen_select, count: 2 }
          - id: inviter-ca-te-dit
            title: Inviting Friends
            description: Invite someone and suggest a time and place.
            vocabulary: ["Ça te dit de … ?", "Tu es libre samedi ?", "On se retrouve où ?", "Tu veux venir ?", "une soirée", "un anniversaire", "une fête", "boire un verre"]
            grammar:
              - pattern: "Ça te dit d'aller au cinéma ce soir ?"
              - pattern: "Tu es libre samedi après-midi ?"
              - pattern: "On se retrouve devant la gare à huit heures ?"
