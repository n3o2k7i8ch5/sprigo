            title: Yes or No, Politely
            description: Accept or turn down an invitation politely and give a reason.
            vocabulary: ["Avec plaisir !", "Bonne idée !", "Je veux bien.", "Désolé, je ne peux pas.", "C'est dommage !", "Une autre fois ?", "je suis occupé", "malheureusement"]
            grammar:
              - pattern: "Avec plaisir, j'arrive vers neuf heures."
              - pattern: "Désolée, je ne peux pas, je travaille samedi."
              - pattern: "C'est gentil, mais une autre fois peut-être ?"
            activities:
              - { type: learn, count: 2 }
              - { type: multiple_choice, count: 2 }
              - { type: word_select, count: 2 }
              - { type: speak }
          - id: regles-il-est-interdit
            title: Rules
            description: Understand and explain rules with il faut, il est interdit de and on n'a pas le droit de.
            vocabulary: ["il faut", "il ne faut pas", "il est interdit de", "on a le droit de", "on n'a pas le droit de", "fumer", "le règlement", "obligatoire"]
            grammar:
              - pattern: "Il est interdit de fumer dans le restaurant."
              - pattern: "On n'a pas le droit de se garer ici."
              - pattern: "Il faut enlever ses chaussures avant d'entrer."
            activities:
              - { type: learn }
              - { type: fill_blank, count: 2 }
              - { type: error_correct }
              - type: dialogue
                scenario: party_invitation
                goal: Invite a friend to a party, agree on a time and explain the house rules.

    checkpoint:
      title: A2 Checkpoint
      required_score: 80
      activities:
        - { type: word_select, count: 3 }
        - { type: fill_blank, count: 3 }
        - { type: error_correct, count: 2 }
        - { type: listen_select, count: 3 }
        - { type: translate, count: 3 }
        - { type: dialogue }

  B1:
    title: Intermediate
    description: >
      Deal with most everyday situations, narrate experiences and events, express wishes, feelings, opinions and plans, and briefly give reasons for them.

    units:
      - id: recits-au-passe
        title: Past Tenses Together
        description: Combine the past tenses to tell what happened, what had happened before and how things were.
        icon: 🕰️
        steps:
          - id: plus-que-parfait
            title: The Plus-que-parfait
            description: Say what had already happened before another past event with avoir or être in the imparfait + participle.
            vocabulary: [avais, étais, avions, étaient, déjà, "pas encore", avant, "quand je suis arrivé", "jamais auparavant"]
            grammar:
              - pattern: "Quand je suis arrivé à la gare, le train était déjà parti."
              - pattern: "Je n'avais jamais vu la mer avant ce voyage."
              - pattern: "Ils avaient déjà dîné quand nous les avons appelés."
            activities:
              - { type: learn, count: 2 }
              - { type: fill_blank, count: 2 }
              - { type: sentence_complete, count: 2 }
              - { type: translate }
          - id: pc-imparfait-pqp-recit
            title: Telling a Story in the Past
            description: Passé composé for events, imparfait for background and plus-que-parfait for earlier events.
            vocabulary: ["tout à coup", "à ce moment-là", "finalement", pendant que, "un peu plus tard", "heureusement", "malheureusement", "soudain"]
            grammar:
              - pattern: "Il faisait beau et nous nous promenions quand tout à coup il a commencé à pleuvoir."
              - pattern: "Je me suis rendu compte que j'avais oublié mes clés."
              - pattern: "Pendant que je faisais la cuisine, mon frère a mis la table."
            activities:
              - { type: learn, count: 2 }
              - { type: multiple_choice, count: 2 }
              - { type: word_bank, count: 2 }
              - { type: error_correct, count: 2 }
              - { type: listen_type }
          - id: accord-participe-cod
            title: Participle Agreement with Avoir
            description: The past participle agrees with a direct object that comes before avoir.
            vocabulary: ["les photos", "la lettre", "les clés", "la robe", prises, écrite, ouverte, mise, faites]
            grammar:
              - pattern: "Les photos que j'ai prises sont magnifiques."
              - pattern: "Ta lettre ? Je l'ai lue hier soir."
              - pattern: "Quelles chaussures as-tu achetées ?"
            activities:
              - { type: learn, count: 2 }
              - { type: fill_blank, count: 2 }
              - { type: error_correct, count: 2 }
              - { type: multiple_choice }
          - id: futur-dans-le-passe
            title: Plans That Changed
            description: Talk about what was about to happen with aller in the imparfait, and tell an anecdote.
            vocabulary: ["j'allais", "nous allions", "être sur le point de", "au dernier moment", "tu sais ce qui m'est arrivé ?", "le pire, c'est que", "sans blague !", "c'est pas vrai !"]
            grammar:
              - pattern: "J'allais partir quand le téléphone a sonné."
              - pattern: "Nous étions sur le point de sortir quand il est arrivé."
              - pattern: "Le pire, c'est que j'avais laissé mon portable à la maison."
            activities:
              - { type: learn }
              - { type: sentence_complete, count: 2 }
              - { type: listen_select, count: 2 }
              - type: dialogue
                scenario: telling_an_anecdote
                goal: Tell a friend about something surprising that happened to you, using several past tenses.

      - id: souhaits-sentiments
        title: Wishes & Feelings
        description: Express wishes and feelings with the subjonctif présent.
        icon: 💭
        steps:
          - id: subjonctif-reguliers
            title: Regular Subjunctive
            description: Form the subjonctif from the ils form of the present (ils parlent → que je parle).
            vocabulary: ["que je parle", "que tu finisses", "qu'il attende", "que nous partions", "que vous preniez", "qu'ils viennent", "il faut que"]
            grammar:
              - pattern: "Il faut que tu finisses tes devoirs."
              - pattern: "Il faut que nous partions tôt demain."
              - pattern: "Il faut qu'il attende le bus."
            activities:
              - { type: learn, count: 3 }
              - { type: fill_blank, count: 2 }
              - { type: match }
              - { type: word_bank, count: 2 }
          - id: subjonctif-irreguliers
            title: Irregular Subjunctive
            description: Learn the irregular forms of faire, aller, être, avoir, pouvoir and savoir.
            vocabulary: ["que je fasse", "que j'aille", "que tu sois", "qu'il ait", "que nous puissions", "que vous sachiez", "qu'ils aillent"]
            grammar:
              - pattern: "Il faut que je fasse les courses."
              - pattern: "Il faut que vous sachiez la vérité."
              - pattern: "Il faut que tu sois à l'heure."
            activities:
              - { type: learn, count: 3 }
              - { type: multiple_choice, count: 2 }
              - { type: fill_blank, count: 2 }
              - { type: error_correct }
          - id: subjonctif-volonte
            title: Wanting Someone To
            description: Use vouloir que, souhaiter que and préférer que + subjonctif.
            vocabulary: ["vouloir que", "souhaiter que", "préférer que", "aimer que", "demander que", "exiger que", "avoir envie que"]
            grammar:
              - pattern: "Mes parents veulent que je fasse des études de médecine."
              - pattern: "Je souhaite que tout se passe bien pour toi."
              - pattern: "Je préfère que tu viennes demain."
            activities:
              - { type: learn, count: 2 }
              - { type: sentence_complete, count: 2 }
              - { type: translate, count: 2 }
              - { type: listen_select }
          - id: emotions-que-subjonctif
            title: Feelings About Others
            description: Emotions + que + subjonctif, but the infinitive when the subject is the same.
            vocabulary: ["être content que", "être ravi que", "être triste que", "avoir peur que", "regretter que", "être déçu que", "être surpris que", dommage]
            grammar:
              - pattern: "Je suis content que tu viennes à ma fête."
              - pattern: "C'est dommage qu'elle ne puisse pas rester."
              - pattern: "Je suis content de venir à ta fête."
            activities:
              - { type: learn }
              - { type: error_correct, count: 2 }
              - { type: fill_blank, count: 2 }
              - type: dialogue
                scenario: good_and_bad_news
                goal: React to a friend's good and bad news, expressing how you feel and what you hope for them.

      - id: donner-son-avis
        title: Opinions
        description: Give and justify your opinion, and agree or disagree politely.
        icon: 🗣️
        steps:
          - id: penser-que-indicatif-subjonctif
            title: "I Think / I Don't Think"
            description: Je pense que + indicatif, but je ne pense pas que + subjonctif.
            vocabulary: ["je pense que", "je crois que", "je trouve que", "je ne pense pas que", "je ne crois pas que", "je doute que", "je suis sûr que"]
            grammar:
              - pattern: "Je pense que c'est une bonne idée."
              - pattern: "Je ne pense pas que ce soit une bonne idée."
              - pattern: "Je doute qu'il puisse venir ce soir."
            activities:
              - { type: learn, count: 2 }
              - { type: multiple_choice, count: 2 }
              - { type: fill_blank, count: 2 }
              - { type: error_correct, count: 2 }
          - id: a-mon-avis-selon-moi
            title: In My Opinion
            description: Introduce your point of view and give reasons.
            vocabulary: ["à mon avis", "selon moi", "d'après moi", "pour moi", "personnellement", "en ce qui me concerne", "d'un côté", "de l'autre côté"]
            grammar:
              - pattern: "À mon avis, la ville est trop chère pour les étudiants."
              - pattern: "Selon moi, le télétravail a beaucoup d'avantages."
              - pattern: "D'un côté c'est pratique, de l'autre côté c'est fatigant."
            activities:
              - { type: learn, count: 2 }
              - { type: word_bank, count: 2 }
              - { type: translate, count: 2 }
              - { type: listen_type }
          - id: il-est-important-que
            title: It's Important That
            description: Impersonal expressions + que + subjonctif.
            vocabulary: ["il est important que", "il est nécessaire que", "il est essentiel que", "il vaut mieux que", "il est normal que", "il est possible que", "il est temps que"]
            grammar:
              - pattern: "Il est important que tout le monde puisse s'exprimer."
              - pattern: "Il vaut mieux que tu prennes le train."
              - pattern: "Il est temps que le gouvernement agisse."
            activities:
              - { type: learn, count: 2 }
              - { type: sentence_complete, count: 2 }
              - { type: fill_blank, count: 2 }
              - { type: multiple_choice }
          - id: etre-d-accord-pas-d-accord
            title: Agreeing & Disagreeing
            description: Agree, disagree and partly agree in a discussion.
            vocabulary: ["je suis d'accord", "je ne suis pas d'accord", "tout à fait", "pas du tout", "tu as raison", "tu as tort", "ça dépend", "c'est vrai, mais"]
            grammar:
              - pattern: "Je suis tout à fait d'accord avec toi."
              - pattern: "C'est vrai, mais je ne crois pas que ce soit si simple."
              - pattern: "Tu as raison sur ce point, mais ça dépend de la situation."
            activities:
              - { type: learn }
              - { type: match }
              - { type: listen_select, count: 2 }
              - type: dialogue
                scenario: friendly_debate
                goal: Discuss whether cars should be banned from city centres, giving your opinion and reacting to the other person's.

      - id: conseils-demandes
        title: Advice & Requests
        description: Give advice and make polite requests with the conditionnel and pronouns.
        icon: 🤝
        steps:
          - id: conditionnel-present
            title: The Conditionnel Présent
            description: Futur stem + imparfait endings for softer, polite statements.
            vocabulary: ["je voudrais", "j'aimerais", "tu devrais", "on pourrait", "il faudrait", "ce serait", "nous aurions", "vous feriez"]
            grammar:
              - pattern: "J'aimerais réserver une table pour deux."
              - pattern: "On pourrait aller au cinéma ce soir."
              - pattern: "Ce serait sympa de se revoir."
            activities:
              - { type: learn, count: 3 }
              - { type: fill_blank, count: 2 }
              - { type: match }
              - { type: listen_type }
          - id: tu-devrais-conseils
            title: Giving Advice
            description: Give advice with tu devrais, il faudrait and à ta place.
            vocabulary: ["tu devrais", "vous devriez", "il faudrait", "tu ferais mieux de", "je te conseille de", "essaie de", "un conseil"]
            grammar:
              - pattern: "Tu devrais te coucher plus tôt."
              - pattern: "Vous feriez mieux de prendre un taxi."
              - pattern: "Je te conseille de parler à ton chef."
            activities:
              - { type: learn, count: 2 }
              - { type: sentence_complete, count: 2 }
              - { type: translate, count: 2 }
              - { type: error_correct }
          - id: doubles-pronoms
            title: Double Object Pronouns
            description: Order two pronouns before the verb, and with the impératif.
            vocabulary: ["je te le donne", "il me la prête", "je le lui ai dit", "nous les leur envoyons", "dis-le-moi", "donne-la-lui", "ne me le dis pas"]
            grammar:
              - pattern: "Tu me prêtes ton vélo ? Oui, je te le prête."
              - pattern: "J'ai dit la nouvelle à Marie. Je la lui ai dite hier."
              - pattern: "Dis-le-moi ! Non, ne me le dis pas !"
            activities:
              - { type: learn, count: 3 }
              - { type: word_bank, count: 2 }
              - { type: error_correct, count: 2 }
              - { type: multiple_choice, count: 2 }
          - id: demandes-polies
            title: Polite Requests
            description: Ask for favours politely with pourrais-tu, est-ce que vous pourriez and ça vous dérangerait de.
            vocabulary: ["pourrais-tu", "pourriez-vous", "est-ce que vous pourriez", "ça te dérangerait de", "ça vous ennuierait de", "rendre service", "avec plaisir", "volontiers"]
            grammar:
              - pattern: "Pourriez-vous m'envoyer le document, s'il vous plaît ?"
              - pattern: "Ça te dérangerait de fermer la fenêtre ?"
              - pattern: "Tu pourrais me le rendre demain ?"
            activities:
              - { type: learn }
              - { type: fill_blank, count: 2 }
              - { type: listen_select, count: 2 }
              - type: dialogue
                scenario: asking_a_neighbour_a_favour
                goal: Politely ask a neighbour to water your plants while you are away and answer their questions.

      - id: hypotheses-si
        title: Hypotheses
        description: Imagine situations and talk about conditions.
        icon: 🤔
        steps:
          - id: si-imparfait-conditionnel
            title: If I Had…
            description: Si + imparfait, then conditionnel, for imaginary situations.
            vocabulary: ["si j'avais", "si j'étais", "si je pouvais", "si on gagnait", "je ferais", "j'irais", "je partirais", "le loto"]
            grammar:
              - pattern: "Si j'avais plus de temps, j'apprendrais le piano."
              - pattern: "Si je gagnais au loto, je ferais le tour du monde."
              - pattern: "Qu'est-ce que tu ferais si tu étais président ?"
            activities:
              - { type: learn, count: 3 }
              - { type: fill_blank, count: 2 }
              - { type: error_correct, count: 2 }
              - { type: translate }
          - id: a-ta-place
            title: If I Were You
            description: Imagine yourself in someone else's situation with à ta place and moi, je.
            vocabulary: ["à ta place", "à votre place", "si j'étais toi", "moi, je", "dans ton cas", "franchement", "hésiter"]
            grammar:
              - pattern: "À ta place, j'accepterais ce travail."
              - pattern: "Si j'étais toi, je n'hésiterais pas."
              - pattern: "Dans ton cas, je demanderais conseil à un avocat."
            activities:
              - { type: learn, count: 2 }
              - { type: sentence_complete, count: 2 }
              - { type: multiple_choice, count: 2 }
              - { type: listen_type }
          - id: au-cas-ou
            title: Just in Case
            description: Au cas où + conditionnel for precautions.
            vocabulary: ["au cas où", "un parapluie", "un plan B", "prévoir", "la panne", "le retard", "en cas de"]
            grammar:
              - pattern: "Prends un parapluie au cas où il pleuvrait."
              - pattern: "Je te donne mon numéro au cas où tu aurais un problème."
              - pattern: "En cas de panne, appelez ce numéro."
            activities:
              - { type: learn, count: 2 }
              - { type: word_bank, count: 2 }
              - { type: fill_blank, count: 2 }
              - { type: error_correct }
          - id: a-condition-que
            title: On One Condition
            description: À condition de + infinitif, à condition que + subjonctif.
            vocabulary: ["à condition de", "à condition que", "pourvu que", "sinon", "sauf si", "d'accord, mais"]
            grammar:
              - pattern: "Tu peux sortir à condition de rentrer avant minuit."
              - pattern: "Je te prête ma voiture à condition que tu fasses le plein."
              - pattern: "On fera un pique-nique, sauf s'il pleut."
            activities:
              - { type: learn }
              - { type: multiple_choice, count: 2 }
              - { type: listen_select, count: 2 }
              - type: dialogue
                scenario: dream_scenarios
                goal: Discuss with a friend what you would do if you won a lot of money, and negotiate conditions for a shared plan.

      - id: discours-indirect
        title: Reported Speech
        description: Report what other people say, ask and tell you to do.
        icon: 💬
        steps:
          - id: il-dit-que-present
            title: He Says That…
            description: Report statements with a present reporting verb; only pronouns and possessives change.
            vocabulary: ["il dit que", "elle explique que", "ils répondent que", "elle annonce que", "il affirme que", "raconter", "prétendre"]
            grammar:
              - pattern: "« Je suis fatigué. » → Il dit qu'il est fatigué."
              - pattern: "Elle explique qu'elle ne peut pas venir."
              - pattern: "Ils répondent que leur train a du retard."
            activities:
              - { type: learn, count: 2 }
              - { type: fill_blank, count: 2 }
              - { type: translate, count: 2 }
              - { type: listen_type }
          - id: il-a-dit-qu-il-viendrait
            title: He Said He Would Come
            description: With a past reporting verb, the tenses shift (présent → imparfait, futur → conditionnel, PC → PQP).
            vocabulary: ["il a dit que", "elle m'a expliqué que", "ce jour-là", "la veille", "le lendemain", "à ce moment-là"]
            grammar:
              - pattern: "Il a dit qu'il viendrait le lendemain."
              - pattern: "Elle m'a dit qu'elle était fatiguée."
              - pattern: "Ils ont expliqué qu'ils avaient raté le train."
            activities:
              - { type: learn, count: 3 }
              - { type: multiple_choice, count: 2 }
              - { type: error_correct, count: 2 }
              - { type: sentence_complete, count: 2 }
          - id: questions-indirectes
            title: Indirect Questions
            description: Report questions with si, ce que, ce qui, où and quand, without inversion.
            vocabulary: ["il demande si", "je me demande", "ce que", "ce qui", "où", "quand", "pourquoi", "savoir si"]
            grammar:
              - pattern: "« Tu viens ? » → Il me demande si je viens."
              - pattern: "Je ne sais pas ce qu'il veut."
              - pattern: "Elle m'a demandé ce qui s'était passé."
            activities:
              - { type: learn, count: 2 }
              - { type: word_bank, count: 2 }
              - { type: fill_blank, count: 2 }
              - { type: error_correct }
          - id: ordres-de-infinitif
            title: Reporting Orders
            description: Report orders and requests with dire / demander de + infinitif.
            vocabulary: ["dire de", "demander de", "conseiller de", "interdire de", "rappeler de", "ne pas oublier de", "un message"]
            grammar:
              - pattern: "« Rappelle-moi ! » → Elle m'a dit de la rappeler."
              - pattern: "Le médecin m'a conseillé de faire du sport."
              - pattern: "Il nous a demandé de ne pas faire de bruit."
            activities:
              - { type: learn }
              - { type: sentence_complete, count: 2 }
              - { type: listen_select, count: 2 }
              - type: dialogue
                scenario: passing_on_a_message
                goal: Pass on to a colleague what your manager said, asked and told you both to do.

      - id: pronoms-relatifs-complexes
        title: Relative Clauses
        description: Join ideas with où, dont, ce qui / ce que and lequel.
        icon: 🔗
        steps:
          - id: relatif-ou-temps-lieu
            title: Où for Place and Time
            description: Use où after places and also after time expressions (le jour où).
            vocabulary: ["la ville où", "la maison où", "le jour où", "l'année où", "le moment où", "l'époque où", "le quartier où"]
            grammar:
              - pattern: "C'est la ville où j'ai grandi."
              - pattern: "Je me souviens du jour où nous nous sommes rencontrés."
              - pattern: "À l'époque où j'étais étudiant, je n'avais pas d'argent."
            activities:
              - { type: learn, count: 2 }
              - { type: fill_blank, count: 2 }
              - { type: error_correct, count: 2 }
              - { type: translate }
          - id: relatif-dont
            title: Dont
            description: Use dont to replace de + noun (parler de, avoir besoin de, être fier de).
            vocabulary: [dont, "parler de", "avoir besoin de", "avoir envie de", "être fier de", "se souvenir de", "avoir peur de"]
            grammar:
              - pattern: "C'est le livre dont je t'ai parlé."
              - pattern: "Voici l'outil dont tu as besoin."
              - pattern: "C'est un projet dont je suis très fier."
            activities:
              - { type: learn, count: 3 }
              - { type: multiple_choice, count: 2 }
              - { type: sentence_complete, count: 2 }
              - { type: listen_type }
          - id: ce-qui-ce-que
            title: What (Ce qui / Ce que)
            description: Ce qui as subject, ce que as object, to say "what" or "the thing that".
            vocabulary: ["ce qui", "ce que", "ce dont", "tout ce que", "ce qui me plaît", "ce que je préfère", "ce qui compte"]
            grammar:
              - pattern: "Ce qui me plaît, c'est l'ambiance."
              - pattern: "Fais ce que tu veux."
              - pattern: "Ce dont j'ai besoin, c'est de vacances."
            activities:
              - { type: learn, count: 2 }
              - { type: word_bank, count: 2 }
              - { type: error_correct, count: 2 }
              - { type: fill_blank }
          - id: lequel-auquel-duquel
            title: Lequel After Prepositions
            description: Use lequel, auquel and duquel after prepositions for things.
            vocabulary: [lequel, laquelle, lesquels, auquel, "à laquelle", duquel, "près duquel", "avec lequel", "sur laquelle"]
            grammar:
              - pattern: "C'est l'ordinateur avec lequel je travaille."
              - pattern: "La question à laquelle je pense est difficile."
              - pattern: "Le parc près duquel j'habite est très calme."
            activities:
              - { type: learn }
              - { type: multiple_choice, count: 2 }
              - { type: listen_select, count: 2 }
              - type: dialogue
                scenario: describing_your_hometown
                goal: Describe the town where you grew up, the places you liked and the people you remember.

      - id: emploi-carriere
        title: Work & Careers
        description: Look for a job, write formal emails and go to an interview.
        icon: 💼
        steps:
          - id: cv-lettre-motivation
            title: CV & Cover Letter
            description: Present your experience, skills and education in a CV and lettre de motivation.
            vocabulary: ["le CV", "la lettre de motivation", "l'expérience professionnelle", "les compétences", "la formation", "le stage", "le diplôme", "une offre d'emploi"]
            grammar:
              - pattern: "J'ai effectué un stage de six mois dans une agence de communication."
              - pattern: "Je suis titulaire d'un master en gestion."
              - pattern: "Je maîtrise l'anglais et l'espagnol."
            activities:
              - { type: learn, count: 3 }
              - { type: match }
              - { type: image_select, count: 2 }
              - { type: translate, count: 2 }
          - id: gerondif-en-travaillant
            title: The Gérondif
            description: En + present participle to say how or while you do something.
            vocabulary: ["en travaillant", "en lisant", "en faisant", "en apprenant", "en étant", "en ayant", "tout en"]
            grammar:
              - pattern: "J'ai appris l'anglais en travaillant à Londres."
              - pattern: "Elle écoute de la musique en faisant son jogging."
              - pattern: "On progresse en faisant des erreurs."
            activities:
              - { type: learn, count: 2 }
              - { type: fill_blank, count: 2 }
              - { type: error_correct, count: 2 }
              - { type: sentence_complete }
          - id: courriel-formel
            title: Formal Emails
            description: Use the formal register to open, request and close a professional email.
            vocabulary: ["Madame, Monsieur,", "je me permets de", "je vous écris au sujet de", "veuillez trouver ci-joint", "dans l'attente de votre réponse", "je vous prie d'agréer", "cordialement"]
            grammar:
              - pattern: "Je me permets de vous contacter au sujet de l'offre d'emploi."
              - pattern: "Veuillez trouver ci-joint mon CV."
              - pattern: "Je vous prie d'agréer, Madame, Monsieur, l'expression de mes salutations distinguées."
            activities:
              - { type: learn, count: 2 }
              - { type: word_bank, count: 2 }
              - { type: multiple_choice, count: 2 }
              - { type: error_correct }
          - id: entretien-embauche
            title: The Job Interview
            description: Talk about your strengths, weaknesses and motivation in an interview.
            vocabulary: ["l'entretien d'embauche", "le poste", "le salaire", "les points forts", "les points faibles", "motivé", "travailler en équipe", "le recruteur"]
            grammar:
              - pattern: "Pourquoi souhaitez-vous travailler chez nous ?"
              - pattern: "Mon point fort, c'est que je sais travailler en équipe."
              - pattern: "J'aimerais évoluer vers un poste à responsabilités."
            activities:
              - { type: learn }
              - { type: listen_select, count: 2 }
              - { type: speak, count: 2 }
              - type: dialogue
                scenario: job_interview
                goal: Answer a recruiter's questions about your experience, strengths and motivation for the position.

      - id: habitudes-mode-de-vie
        title: Habits & Lifestyle
        description: Describe how you live, your habits and how you want to change them.
        icon: 🧘
        steps:
          - id: adverbes-en-ment
            title: Adverbs in -ment
            description: Form adverbs from the feminine adjective, and -amment / -emment from -ant / -ent.
            vocabulary: [régulièrement, lentement, facilement, vraiment, constamment, évidemment, récemment, prudemment]
            grammar:
              - pattern: "Je fais régulièrement du sport."
              - pattern: "Il parle constamment de son travail."
              - pattern: "J'ai récemment arrêté le café."
            activities:
              - { type: learn, count: 2 }
              - { type: match }
              - { type: fill_blank, count: 2 }
              - { type: error_correct, count: 2 }
          - id: avoir-l-habitude-s-habituer
            title: Being Used To
            description: Avoir l'habitude de + infinitif and s'habituer à + noun or infinitif.
            vocabulary: ["avoir l'habitude de", "s'habituer à", "être habitué à", "d'habitude", "comme d'habitude", "une habitude", "le rythme"]
            grammar:
              - pattern: "J'ai l'habitude de me lever tôt."
              - pattern: "Je ne me suis pas encore habitué au froid."
              - pattern: "D'habitude, je prends le métro."
            activities:
              - { type: learn, count: 2 }
              - { type: multiple_choice, count: 2 }
              - { type: translate, count: 2 }
              - { type: listen_type }
          - id: il-faut-que-sante
            title: Healthy Routines
            description: Talk about what you need to do for your health with il faut que + subjonctif.
            vocabulary: ["le sommeil", "l'alimentation", "équilibré", "faire de l'exercice", "boire de l'eau", "le stress", "se détendre", "en forme"]
            grammar:
              - pattern: "Il faut que je dorme au moins sept heures par nuit."
              - pattern: "Il faut qu'on mange plus de légumes."
              - pattern: "Le médecin dit qu'il faut que je fasse de l'exercice."
            activities:
              - { type: learn, count: 2 }
              - { type: image_select, count: 2 }
              - { type: sentence_complete, count: 2 }
              - { type: error_correct }
          - id: arreter-de-se-mettre-a
            title: Changing Habits
            description: Talk about starting and stopping habits with se mettre à, arrêter de and continuer à.
            vocabulary: ["arrêter de", "se mettre à", "continuer à", "commencer à", "essayer de", "réussir à", "fumer", "la bonne résolution"]
            grammar:
              - pattern: "J'ai arrêté de fumer il y a deux ans."
              - pattern: "Je me suis mis au yoga cette année."
              - pattern: "J'essaie de passer moins de temps sur mon téléphone."
            activities:
              - { type: learn }
              - { type: word_bank, count: 2 }
              - { type: listen_select, count: 2 }
              - type: dialogue
                scenario: lifestyle_change
                goal: Tell a friend about a habit you changed, how you did it and give them advice.

      - id: medias-technologie
        title: Media & Technology
        description: Talk about news, social media and technology, and explain causes.
        icon: 📱
        steps:
          - id: voix-passive
            title: The Passive Voice
            description: Être + past participle (with agreement) in the présent and passé composé, with par.
            vocabulary: ["est publié", "a été inventé", "a été construite", "sont vendus", "par", "l'inventeur", "la découverte"]
            grammar:
              - pattern: "Le journal est publié tous les matins."
              - pattern: "Le téléphone a été inventé par Graham Bell."
              - pattern: "Ces maisons ont été construites en 1950."
            activities:
              - { type: learn, count: 3 }
              - { type: fill_blank, count: 2 }
              - { type: error_correct, count: 2 }
              - { type: translate }
          - id: on-impersonnel-actualites
            title: The News
            description: News vocabulary and on as an impersonal subject.
            vocabulary: ["l'actualité", "les infos", "un article", "le journaliste", "la une", "un reportage", "une source", "on dit que"]
            grammar:
              - pattern: "On dit que les prix vont encore augmenter."
              - pattern: "On parle beaucoup de cette affaire à la télé."
              - pattern: "Ici, on parle français."
            activities:
              - { type: learn, count: 2 }
              - { type: match }
              - { type: multiple_choice, count: 2 }
              - { type: listen_type }
          - id: reseaux-sociaux-numerique
            title: Social Media & Tech
            description: Talk about social networks, apps and online life.
            vocabulary: ["les réseaux sociaux", "une appli", "télécharger", "partager", "publier", "un abonné", "le mot de passe", "en ligne", "une fake news"]
            grammar:
              - pattern: "J'ai publié une photo sur Instagram."
              - pattern: "Il passe trop de temps sur les réseaux sociaux."
              - pattern: "N'oublie pas de changer ton mot de passe."
            activities:
              - { type: learn, count: 2 }
              - { type: image_select, count: 2 }
              - { type: word_bank, count: 2 }
              - { type: fill_blank }
          - id: grace-a-a-cause-de
            title: Giving Reasons
            description: Explain causes with parce que, car, grâce à and à cause de.
            vocabulary: ["parce que", car, "grâce à", "à cause de", "comme", "puisque", "en raison de", "c'est pour ça que"]
            grammar:
              - pattern: "Grâce à internet, on peut travailler de n'importe où."
              - pattern: "Le vol a été annulé à cause de la grève."
              - pattern: "Comme il pleuvait, nous sommes restés à la maison."
            activities:
              - { type: learn }
              - { type: error_correct, count: 2 }
              - { type: listen_select, count: 2 }
              - type: dialogue
                scenario: technology_debate
                goal: Discuss the advantages and disadvantages of social media, giving reasons for your opinions.

    checkpoint:
      title: B1 Checkpoint
      required_score: 80
      activities:
        - { type: word_select, count: 3 }
        - { type: fill_blank, count: 3 }
        - { type: error_correct, count: 2 }
        - { type: listen_select, count: 3 }
        - { type: translate, count: 3 }
        - { type: dialogue }

  B2:
    title: Upper Intermediate
    description: >
      Understand the main ideas of complex texts, interact with fluency and spontaneity, and argue a viewpoint on a wide range of topics, weighing advantages and disadvantages.

    units:
      - id: regrets-hypothetiques
        title: Regrets & Hypotheticals
        description: Talk about unreal situations in the past and the present, and express regret.
        icon: 💭
        steps:
          - id: conditionnel-passe-forme
            title: The Past Conditional
            description: Form the conditionnel passé with avoir or être in the conditional and a past participle.
            vocabulary: ["j'aurais fait", "tu serais venu", "il aurait dit", "nous serions partis", "vous auriez pris", "elles seraient restées", "à ta place", volontiers]
            grammar:
              - pattern: "À ta place, j'aurais accepté son offre."
              - pattern: "Elle serait venue avec plaisir."
              - pattern: "Nous aurions préféré partir plus tôt."
            activities:
              - { type: learn, count: 2 }
              - { type: fill_blank, count: 2 }
              - { type: multiple_choice, count: 2 }
              - { type: listen_type }
          - id: si-plus-que-parfait-regrets
            title: If I Had Known
            description: Use si + plus-que-parfait with the conditionnel passé for unreal past conditions.
            vocabulary: ["si j'avais su", "à temps", "l'occasion", "rater le train", "se rendre compte", prévenir, "par hasard", "trop tard"]
            grammar:
              - pattern: "Si j'avais su, je ne serais pas venu."
              - pattern: "Si nous étions partis plus tôt, nous n'aurions pas raté le train."
              - pattern: "Si tu m'avais prévenu, je t'aurais aidé."
            activities:
              - { type: learn, count: 2 }
              - { type: fill_blank, count: 2 }
              - { type: word_bank, count: 2 }
              - { type: error_correct }
              - { type: translate }
          - id: conditionnels-mixtes-medecin
            title: Mixed Conditionals
            description: Link a past condition to a present result, and a present condition to a past result.
            vocabulary: ["aujourd'hui", "à l'heure actuelle", "être marié", "vivre à l'étranger", "les études", choisir, "accepter un poste", différent]
            grammar:
              - pattern: "Si j'avais étudié la médecine, je serais médecin aujourd'hui."
              - pattern: "Si j'avais accepté ce poste, je vivrais à Londres maintenant."
              - pattern: "S'il était moins timide, il lui aurait demandé son numéro."
            activities:
              - { type: learn, count: 2 }
              - { type: sentence_complete, count: 2 }
              - { type: multiple_choice, count: 2 }
              - { type: translate }
              - { type: listen_type }
          - id: aurais-du-aurais-pu
            title: I Should Have, I Could Have
            description: Express regret and reproach with j'aurais dû, j'aurais pu and regretter de + infinitif passé.
            vocabulary: ["j'aurais dû", "j'aurais pu", "tu aurais dû", regretter, "le regret", "la faute", "s'excuser", "écouter les conseils"]
            grammar:
              - pattern: "J'aurais dû t'écouter."
              - pattern: "Tu aurais pu me le dire avant !"
              - pattern: "Je regrette de ne pas avoir suivi ses conseils."
            activities:
              - { type: learn }
              - { type: fill_blank, count: 2 }
              - { type: error_correct }
              - { type: speak }
              - type: dialogue
                scenario: talking_about_regrets
                goal: Tell a friend about a decision you regret and say what you should have done differently.

      - id: deduction-hypotheses
        title: Deduction & Speculation
        description: Make guesses about the present and the past, and report unconfirmed information.
        icon: 🔍
        steps:
          - id: devoir-probabilite
            title: He Must Have Forgotten
            description: Use devoir in the present and the passé composé to express probability.
            vocabulary: ["il a dû", "elle doit être", sûrement, probablement, "sans doute", oublier, "se tromper", "les clés"]
            grammar:
              - pattern: "Il a dû oublier notre rendez-vous."
              - pattern: "Elle doit être fatiguée après ce voyage."
              - pattern: "Ils ont dû se tromper d'adresse."
            activities:
              - { type: learn, count: 2 }
              - { type: multiple_choice, count: 2 }
              - { type: fill_blank, count: 2 }
              - { type: listen_select }
          - id: futur-anterieur-probabilite
            title: He Will Have Missed His Train
            description: Use the futur antérieur to guess what has probably happened.
            vocabulary: ["il aura raté", "elle sera partie", "ils auront oublié", "le retard", "la panne", "les embouteillages", "être coincé", "ne pas répondre"]
            grammar:
              - pattern: "Il n'est pas encore là ; il aura raté son train."
              - pattern: "Elle ne répond pas, elle sera déjà partie."
              - pattern: "Ils auront été coincés dans les embouteillages."
            activities:
              - { type: learn, count: 2 }
              - { type: fill_blank, count: 2 }
              - { type: sentence_complete, count: 2 }
              - { type: error_correct }
          - id: conditionnel-journalistique
            title: Reported Rumours
            description: Use the conditionnel journalistique to report unconfirmed news.
            vocabulary: ["selon", "d'après", "la rumeur", "l'information", "non confirmé", "le ministre", "démissionner", "les sources"]
            grammar:
              - pattern: "Le ministre serait malade."
              - pattern: "Selon nos sources, l'entreprise aurait licencié deux cents salariés."
              - pattern: "D'après la presse, le président démissionnerait la semaine prochaine."
            activities:
              - { type: learn, count: 2 }
              - { type: translate, count: 2 }
              - { type: multiple_choice, count: 2 }
              - { type: listen_type }
          - id: il-semble-que-subjonctif
            title: It Seems That
            description: Contrast il semble que + subjonctif with il me semble que + indicatif.
            vocabulary: ["il semble que", "il me semble que", "on dirait que", "avoir l'air", apparemment, "à première vue", "le témoin", "l'indice"]
            grammar:
              - pattern: "Il semble que le voleur soit entré par la fenêtre."
              - pattern: "Il me semble que tu as raison."
              - pattern: "On dirait qu'il va pleuvoir."
            activities:
              - { type: learn }
              - { type: fill_blank, count: 2 }
              - { type: error_correct }
              - { type: speak }
              - type: dialogue
                scenario: solving_a_mystery
                goal: Speculate with a friend about why a colleague has not turned up and what might have happened.

      - id: passif-impersonnel
        title: Passive & Impersonal
        description: Shift the focus away from who does an action with the passive and impersonal structures.
        icon: 🏗️
        steps:
          - id: passif-tous-temps
            title: The Passive in All Tenses
            description: Form the passive in the present, past, future and conditional with être + participe passé.
            vocabulary: ["être construit", "a été fondé", "sera inauguré", "avait été vendu", "le pont", "l'architecte", "les travaux", "la cathédrale"]
            grammar:
              - pattern: "Le pont a été construit en 1890."
              - pattern: "Le nouveau musée sera inauguré l'année prochaine."
              - pattern: "La maison avait été vendue avant notre arrivée."
            activities:
              - { type: learn, count: 2 }
              - { type: fill_blank, count: 2 }
              - { type: translate, count: 2 }
              - { type: listen_type }
          - id: passif-par-ou-de
            title: Par or De?
            description: Choose par for the agent of an action and de after verbs of feeling and states.
            vocabulary: ["aimé de", "respecté de", "entouré de", "couvert de", "suivi par", "écrit par", "le complément d'agent", admiré]
            grammar:
              - pattern: "Ce roman a été écrit par Victor Hugo."
              - pattern: "Ce professeur est respecté de tous ses élèves."
              - pattern: "Le village est entouré de montagnes."
            activities:
              - { type: learn, count: 2 }
              - { type: multiple_choice, count: 2 }
              - { type: error_correct, count: 2 }
              - { type: fill_blank }
          - id: se-faire-voler-velo
            title: I Had My Bike Stolen
            description: Use se faire + infinitif and the pronominal passive (ça se mange froid).
            vocabulary: ["se faire voler", "se faire couper les cheveux", "se faire opérer", "se vendre", "se boire", "se dire", "le vélo", "le portefeuille"]
            grammar:
              - pattern: "Je me suis fait voler mon vélo hier soir."
              - pattern: "Ce plat se mange froid."
              - pattern: "Ça ne se dit pas en français."
            activities:
              - { type: learn, count: 2 }
              - { type: word_bank, count: 2 }
              - { type: sentence_complete, count: 2 }
              - { type: translate }
          - id: il-impersonnel-sagit
            title: Impersonal Il
            description: Use impersonal il with il est + adjectif + de, il reste, il manque and il s'agit de.
            vocabulary: ["il est important de", "il est interdit de", "il reste", "il manque", "il s'agit de", "il suffit de", "il vaut mieux", "le formulaire"]
            grammar:
              - pattern: "Il est interdit de fumer dans le bâtiment."
              - pattern: "Il reste encore trois places."
              - pattern: "Dans ce film, il s'agit d'une famille qui déménage."
            activities:
              - { type: learn }
              - { type: fill_blank, count: 2 }
              - { type: error_correct }
              - { type: listen_select }
              - type: dialogue
                scenario: reporting_a_theft
                goal: Report to the police that your bike was stolen and explain what happened.

      - id: temps-futur-propositions
        title: Time Clauses & the Future
        description: Sequence events in the future and the past with time conjunctions.
        icon: ⏳
        steps:
          - id: futur-anterieur-quand
            title: When I Have Finished
            description: Use the futur antérieur after quand, dès que, lorsque and une fois que.
            vocabulary: [quand, "dès que", lorsque, "aussitôt que", "une fois que", terminer, "le diplôme", "le stage"]
            grammar:
              - pattern: "Quand j'aurai terminé mes études, je voyagerai."
              - pattern: "Dès que tu seras arrivé, appelle-moi."
              - pattern: "Une fois que nous aurons signé le contrat, nous commencerons."
            activities:
              - { type: learn, count: 2 }
              - { type: fill_blank, count: 2 }
              - { type: error_correct, count: 2 }
              - { type: translate }
          - id: avant-que-avant-de
            title: Before
            description: Contrast avant que + subjonctif (with optional ne explétif) and avant de + infinitif.
            vocabulary: ["avant que", "avant de", "le ne explétif", "à moins que", "partir", "rentrer", "il fait nuit", "réfléchir"]
            grammar:
              - pattern: "Rentrons avant qu'il ne fasse nuit."
              - pattern: "Réfléchis bien avant de répondre."
              - pattern: "Je voudrais te parler avant que tu partes."
            activities:
              - { type: learn, count: 2 }
              - { type: multiple_choice, count: 2 }
              - { type: sentence_complete, count: 2 }
              - { type: listen_type }
          - id: apres-infinitif-passe
            title: After Having Done
            description: Use après + infinitif passé when both actions share the same subject.
            vocabulary: ["après avoir mangé", "après être sorti", "après s'être levé", "ensuite", "puis", "le petit-déjeuner", "se doucher", "la réunion"]
            grammar:
              - pattern: "Après avoir mangé, nous sommes allés nous promener."
              - pattern: "Après être rentrée, elle s'est couchée."
              - pattern: "Après s'être levés, ils ont pris leur petit-déjeuner."
            activities:
              - { type: learn, count: 2 }
              - { type: fill_blank, count: 2 }
              - { type: word_bank, count: 2 }
              - { type: error_correct }
          - id: jusqua-ce-que-attendant
            title: Until & While Waiting
            description: Use jusqu'à ce que and en attendant que + subjonctif, and en attendant de + infinitif.
            vocabulary: ["jusqu'à ce que", "en attendant que", "en attendant de", "le délai", "la réponse", patienter, "le colis", "être livré"]
            grammar:
              - pattern: "Je resterai ici jusqu'à ce que tu reviennes."
              - pattern: "En attendant que le colis soit livré, je travaille à la maison."
              - pattern: "En attendant de recevoir une réponse, il patiente."
            activities:
              - { type: learn }
              - { type: fill_blank, count: 2 }
              - { type: listen_select }
              - { type: speak }
              - type: dialogue
                scenario: planning_after_graduation
                goal: Explain to a friend what you will do once you have finished your studies and what has to happen first.

      - id: articulateurs-logiques
        title: Linking Ideas
        description: Connect ideas to express cause, consequence, addition and contrast.
        icon: 🔗
        steps:
          - id: cause-puisque-faute-de
            title: Expressing Cause
            description: Express cause with puisque, comme, étant donné que, vu que and faute de.
            vocabulary: [puisque, comme, "étant donné que", "vu que", "faute de", "en raison de", "la cause", "le manque"]
            grammar:
              - pattern: "Comme il pleuvait, nous sommes restés à la maison."
              - pattern: "Puisque tu es là, aide-moi un peu."
              - pattern: "Faute de temps, je n'ai pas pu finir le rapport."
            activities:
              - { type: learn, count: 2 }
              - { type: multiple_choice, count: 2 }
              - { type: fill_blank, count: 2 }
              - { type: translate }
          - id: consequence-si-bien-que
            title: Expressing Consequence
            description: Express consequence with si bien que, de sorte que, c'est pourquoi and tellement … que.
            vocabulary: ["si bien que", "de sorte que", "c'est pourquoi", "par conséquent", "tellement … que", "si … que", donc, "la conséquence"]
            grammar:
              - pattern: "Il a beaucoup neigé, si bien que les routes sont fermées."
              - pattern: "J'étais tellement fatigué que je me suis endormi dans le train."
              - pattern: "Le magasin a fermé, c'est pourquoi j'ai commandé en ligne."
            activities:
              - { type: learn, count: 2 }
              - { type: sentence_complete, count: 2 }
              - { type: word_bank, count: 2 }
              - { type: listen_type }
          - id: grace-a-cause-de-nuances
            title: Thanks To or Because Of?
            description: Contrast positive grâce à with negative à cause de, and use à force de.
            vocabulary: ["grâce à", "à cause de", "à force de", "le soutien", "la grève", "la réussite", "l'échec", "le travail acharné"]
            grammar:
              - pattern: "Grâce à ton aide, j'ai réussi mon examen."
              - pattern: "À cause de la grève, le train a été annulé."
              - pattern: "À force de travailler, elle a obtenu une promotion."
            activities:
              - { type: learn, count: 2 }
              - { type: multiple_choice, count: 2 }
              - { type: error_correct, count: 2 }
              - { type: fill_blank }
          - id: en-outre-en-revanche
            title: Adding & Contrasting
            description: Add and contrast ideas with en outre, par ailleurs, de plus, en revanche and alors que.
            vocabulary: ["en outre", "par ailleurs", "de plus", "en revanche", "alors que", "tandis que", "par contre", "d'un côté"]
            grammar:
              - pattern: "Cet appartement est lumineux ; en outre, il est bien situé."
              - pattern: "Mon frère adore la ville, alors que moi, je préfère la campagne."
              - pattern: "Le loyer est élevé ; en revanche, le quartier est très calme."
            activities:
              - { type: learn }
              - { type: fill_blank, count: 2 }
              - { type: error_correct }
              - { type: translate }
              - type: dialogue
                scenario: choosing_a_flat
                goal: Compare two flats with a friend, giving reasons and weighing the pros and cons of each.

      - id: but-concession
        title: Purpose & Concession
        description: Say why you do things and acknowledge obstacles or opposing facts.
        icon: 🎯
        steps:
          - id: pour-que-afin-que
            title: So That
            description: Use pour que / afin que + subjonctif, and pour / afin de + infinitif with the same subject.
            vocabulary: ["pour que", "afin que", "pour", "afin de", "de manière à", "comprendre", "expliquer", "lentement"]
            grammar:
              - pattern: "Je parle lentement pour que tu me comprennes."
              - pattern: "Elle économise afin de s'acheter une voiture."
              - pattern: "Je te le répète afin que tu ne l'oublies pas."
            activities:
              - { type: learn, count: 2 }
              - { type: fill_blank, count: 2 }
              - { type: multiple_choice, count: 2 }
              - { type: listen_type }
          - id: de-peur-que-crainte
            title: For Fear That
            description: Express negative purpose with de peur que / de crainte que + subjonctif and de peur de.
            vocabulary: ["de peur que", "de crainte que", "de peur de", "pour ne pas", "se perdre", "réveiller", "en silence", "le bébé"]
            grammar:
              - pattern: "Il marche sur la pointe des pieds de peur que le bébé ne se réveille."
              - pattern: "Elle a pris un plan de peur de se perdre."
              - pattern: "Je parle doucement pour ne pas vous déranger."
            activities:
              - { type: learn, count: 2 }
              - { type: sentence_complete, count: 2 }
              - { type: error_correct }
              - { type: translate }
          - id: bien-que-meme-si
            title: Although & Even If
            description: Contrast bien que / quoique + subjonctif with même si + indicatif.
            vocabulary: ["bien que", quoique, "même si", pourtant, cependant, néanmoins, "malgré tout", "la fatigue"]
            grammar:
              - pattern: "Bien qu'il soit malade, il est venu travailler."
              - pattern: "Même s'il pleut, nous sortirons."
              - pattern: "Quoiqu'elle ait beaucoup d'argent, elle vit simplement."
            activities:
              - { type: learn, count: 2 }
              - { type: multiple_choice, count: 2 }
              - { type: error_correct, count: 2 }
              - { type: fill_blank }
          - id: malgre-avoir-beau
            title: Despite & No Matter How
            description: Use malgré / en dépit de + nom and avoir beau + infinitif.
            vocabulary: [malgré, "en dépit de", "avoir beau", "les difficultés", "le mauvais temps", "les efforts", insister, "rien à faire"]
            grammar:
              - pattern: "Malgré le mauvais temps, le match a eu lieu."
              - pattern: "J'ai beau insister, il ne veut rien entendre."
              - pattern: "En dépit de ses efforts, il n'a pas obtenu le poste."
            activities:
              - { type: learn }
              - { type: fill_blank, count: 2 }
              - { type: translate }
              - { type: speak }
              - type: dialogue
                scenario: persuading_a_reluctant_friend
                goal: Convince a friend to join a project despite their doubts, explaining your reasons and acknowledging the obstacles.

      - id: discours-rapporte-avance
        title: Advanced Reported Speech
        description: Report statements, questions and orders accurately in the past.
        icon: 🗣️
        steps:
          - id: concordance-des-temps
            title: Sequence of Tenses
            description: Shift tenses after a past reporting verb (présent → imparfait, passé composé → plus-que-parfait, futur → conditionnel).
            vocabulary: ["il a dit que", "elle a expliqué que", "ils ont annoncé que", "la concordance des temps", "le discours indirect", "la promesse", "promettre", "annoncer"]
            grammar:
              - pattern: "Il a dit qu'il l'avait déjà fait."
              - pattern: "Elle m'a promis qu'elle le ferait le lendemain."
              - pattern: "Ils ont annoncé qu'ils étaient en retard."
            activities:
              - { type: learn, count: 2 }
              - { type: fill_blank, count: 2 }
              - { type: error_correct, count: 2 }
              - { type: translate }
          - id: verbes-introducteurs-nier
            title: Reporting Verbs
            description: Choose precise reporting verbs like prétendre, affirmer, nier, reconnaître, avouer and se plaindre que.
            vocabulary: [prétendre, affirmer, nier, reconnaître, avouer, "se plaindre que", admettre, "répliquer"]
            grammar:
              - pattern: "Le suspect a nié avoir volé la voiture."
              - pattern: "Elle a reconnu qu'elle s'était trompée."
              - pattern: "Les voisins se sont plaints que la musique était trop forte."
            activities:
              - { type: learn, count: 2 }
              - { type: multiple_choice, count: 2 }
              - { type: word_bank, count: 2 }
              - { type: listen_type }
          - id: la-veille-le-lendemain
            title: The Day Before, the Next Day
            description: Shift time and place expressions in reported speech (hier → la veille, demain → le lendemain).
            vocabulary: ["la veille", "le lendemain", "ce jour-là", "la semaine suivante", "la semaine précédente", "à ce moment-là", "là-bas", "deux jours plus tard"]
            grammar:
              - pattern: "Il m'a dit qu'il était arrivé la veille."
              - pattern: "Elle a expliqué qu'elle partirait le lendemain."
              - pattern: "Ils ont dit qu'ils seraient là-bas la semaine suivante."
            activities:
              - { type: learn, count: 2 }
              - { type: fill_blank, count: 2 }
              - { type: sentence_complete, count: 2 }
              - { type: error_correct }
          - id: questions-ordres-rapportes
            title: Reporting Questions & Orders
            description: Report questions with si, ce que, ce qui and orders with de + infinitif.
            vocabulary: ["demander si", "ce que", "ce qui", "demander de", "ordonner de", "conseiller de", "supplier de", "interdire de"]
            grammar:
              - pattern: "Il m'a demandé si j'avais fini."
              - pattern: "Elle voulait savoir ce qui s'était passé."
              - pattern: "Le médecin m'a conseillé de me reposer."
            activities:
              - { type: learn }
              - { type: fill_blank, count: 2 }
              - { type: error_correct }
              - { type: listen_select }
              - type: dialogue
                scenario: passing_on_a_message
                goal: Tell a colleague what your manager said, asked and told you both to do in yesterday's meeting.

      - id: debat-persuasion
        title: Debate & Persuasion
        description: Express degrees of certainty, emphasise your point and counter arguments.
        icon: 🎤
        steps:
          - id: doute-subjonctif-certitude
            title: Doubt & Certainty
            description: Use the subjonctif after doubt (je doute que, je ne pense pas que) and the indicatif after certainty.
            vocabulary: ["je doute que", "je ne pense pas que", "je ne crois pas que", "je suis sûr que", "il est certain que", "il est évident que", "sans aucun doute", "l'argument"]
            grammar:
              - pattern: "Je doute que cette mesure soit efficace."
              - pattern: "Je suis sûr qu'il a raison."
              - pattern: "Je ne pense pas que ce soit une bonne idée."
            activities:
              - { type: learn, count: 2 }
              - { type: multiple_choice, count: 2 }
              - { type: error_correct, count: 2 }
              - { type: fill_blank }
          - id: possible-ou-probable
            title: Possible or Probable?
            description: Contrast il est possible que + subjonctif with il est probable que + indicatif.
            vocabulary: ["il est possible que", "il se peut que", "il est probable que", "il est peu probable que", "il est impossible que", "les chances", "la prévision", "le résultat"]
            grammar:
              - pattern: "Il est possible que le gouvernement change d'avis."
              - pattern: "Il est probable que les prix vont augmenter."
              - pattern: "Il est peu probable qu'il vienne ce soir."
            activities:
              - { type: learn, count: 2 }
              - { type: fill_blank, count: 2 }
              - { type: sentence_complete, count: 2 }
              - { type: listen_type }
          - id: mise-en-relief-cest-qui
            title: Emphasis with C'est … Qui / Que
            description: Highlight a key element with the mise en relief c'est … qui and c'est … que.
            vocabulary: ["c'est … qui", "c'est … que", "ce qui", "ce que", "ce dont", "la mise en relief", "le point essentiel", souligner]
            grammar:
              - pattern: "C'est le prix qui pose problème, pas la qualité."
              - pattern: "C'est à vous que je m'adresse."
              - pattern: "Ce qui me dérange, c'est son manque d'honnêteté."
            activities:
              - { type: learn, count: 2 }
              - { type: word_bank, count: 2 }
              - { type: translate, count: 2 }
              - { type: error_correct }
          - id: certes-il-nempeche-que
            title: Conceding & Countering
            description: Concede a point and counter it with certes … mais, il n'empêche que and toujours est-il que.
            vocabulary: ["certes", "il n'empêche que", "toujours est-il que", "il est vrai que", "cela dit", "quand même", "le contre-argument", "réfuter"]
            grammar:
              - pattern: "Certes, ce projet coûte cher, mais il créera des emplois."
              - pattern: "Il est vrai qu'il a de l'expérience ; il n'empêche qu'il a commis une erreur."
              - pattern: "Cela dit, je comprends ton point de vue."
            activities:
              - { type: learn }
              - { type: fill_blank, count: 2 }
              - { type: multiple_choice }
              - { type: speak }
              - type: dialogue
                scenario: debating_a_city_policy
                goal: Debate whether cars should be banned from the city centre, conceding some points and defending your view.

      - id: societe-environnement
        title: Society & the Environment
        description: Discuss social and environmental issues, propose solutions and interpret figures.
        icon: 🌍
        steps:
          - id: nominalisation-hausse
            title: Nominalisation
            description: Turn verbs into nouns (augmenter → la hausse, réduire → la réduction) to sound more formal.
            vocabulary: ["la hausse", "la baisse", "la réduction", "le réchauffement", "l'augmentation", "la diminution", "la suppression", "la mise en place"]
            grammar:
              - pattern: "La hausse des prix inquiète les consommateurs."
              - pattern: "La réduction des émissions est une priorité."
              - pattern: "On constate une forte diminution du chômage."
            activities:
              - { type: learn, count: 2 }
              - { type: match }
              - { type: fill_blank, count: 2 }
              - { type: translate }
          - id: rechauffement-climatique
            title: Environmental Issues
            description: Talk about climate change, pollution and protecting the planet.
            vocabulary: ["le réchauffement climatique", "les gaz à effet de serre", "les énergies renouvelables", "la biodiversité", "le recyclage", "la sécheresse", "les déchets", "l'empreinte carbone"]
            grammar:
              - pattern: "Le réchauffement climatique menace la biodiversité."
              - pattern: "Il faut développer les énergies renouvelables."
              - pattern: "Nous produisons de plus en plus de déchets."
            activities:
              - { type: learn, count: 2 }
              - { type: image_select, count: 2 }
              - { type: listen_select, count: 2 }
              - { type: word_select, count: 2 }
          - id: il-faudrait-que-propositions
            title: Proposals & Obligations
            description: Make proposals with il faudrait que + subjonctif, il serait souhaitable de and on devrait.
            vocabulary: ["il faudrait que", "il serait souhaitable de", "il est urgent de", "on devrait", "proposer", "la mesure", "les pouvoirs publics", "les inégalités"]
            grammar:
              - pattern: "Il faudrait que chacun fasse un effort."
              - pattern: "Il serait souhaitable de réduire la circulation en ville."
              - pattern: "Les pouvoirs publics devraient lutter contre les inégalités."
            activities:
              - { type: learn, count: 2 }
              - { type: fill_blank, count: 2 }
              - { type: error_correct, count: 2 }
              - { type: sentence_complete }
          - id: statistiques-un-tiers
            title: Statistics
            description: Describe figures with fractions and percentages (la moitié de, un tiers, augmenter de 10 %).
            vocabulary: ["la moitié de", "un tiers", "un quart", "la majorité de", "augmenter de", "baisser de", "le pourcentage", "le sondage"]
            grammar:
              - pattern: "La moitié des Français trient leurs déchets."
              - pattern: "Le nombre de cyclistes a augmenté de 10 % en un an."
              - pattern: "Selon un sondage, un tiers des jeunes souhaitent vivre à la campagne."
            activities:
              - { type: learn }
              - { type: listen_type, count: 2 }
              - { type: fill_blank, count: 2 }
              - { type: translate }
              - type: dialogue
                scenario: town_hall_environment_meeting
                goal: Present figures on a local environmental problem at a town meeting and propose two concrete measures.

      - id: sciences-culture-arts
        title: Science, Culture & the Arts
        description: Describe and critique works of art, films and books, and talk about scientific discoveries.
        icon: 🎨
        steps:
          - id: participe-present-adjectif-verbal
            title: Participle or Adjective?
            description: Distinguish the participe présent (invariable) from the adjectif verbal (agrees, sometimes spelt differently).
            vocabulary: [convainquant, convaincant, fatiguant, fatigant, précédant, précédent, provoquant, provocant]
            grammar:
              - pattern: "Son argument est très convaincant."
              - pattern: "Convainquant ses collègues, elle a fait adopter le projet."
              - pattern: "Ce sont des journées fatigantes."
            activities:
              - { type: learn, count: 2 }
              - { type: multiple_choice, count: 2 }
              - { type: error_correct, count: 2 }
              - { type: fill_blank }
          - id: decrire-oeuvre-art
            title: Describing a Work of Art
            description: Describe a painting or sculpture, its style, colours and the feelings it evokes.
            vocabulary: ["le tableau", "le peintre", "au premier plan", "à l'arrière-plan", "les couleurs vives", "le portrait", "le paysage", "l'œuvre"]
            grammar:
              - pattern: "Au premier plan, on voit une femme assise près d'une fenêtre."
              - pattern: "Ce tableau dégage une impression de calme."
              - pattern: "Les couleurs vives rendent la scène très vivante."
            activities:
              - { type: learn, count: 2 }
              - { type: image_select, count: 2 }
              - { type: word_bank, count: 2 }
              - { type: listen_type }
          - id: critique-mise-en-scene
            title: Film & Book Reviews
            description: Review a film or book, commenting on the plot, the direction and the performances.
            vocabulary: ["le scénario", "la mise en scène", "l'intrigue", "le personnage principal", "le dénouement", "le jeu des acteurs", "le rebondissement", "le roman"]
            grammar:
              - pattern: "L'intrigue est captivante du début à la fin."
              - pattern: "La mise en scène est soignée, mais le scénario manque d'originalité."
              - pattern: "Le jeu des acteurs m'a beaucoup ému."
            activities:
              - { type: learn, count: 2 }
              - { type: translate, count: 2 }
              - { type: sentence_complete, count: 2 }
              - { type: error_correct }
          - id: decouverte-scientifique
            title: Science & Discovery
            description: Talk about research, experiments and scientific breakthroughs.
            vocabulary: ["la découverte", "le chercheur", "la chercheuse", "l'expérience", "le laboratoire", "la recherche", "le vaccin", "faire une avancée"]
            grammar:
              - pattern: "Cette découverte a été faite par une équipe de chercheurs français."
              - pattern: "Les résultats de l'expérience ont surpris les scientifiques."
              - pattern: "Grâce à ce vaccin, des millions de vies ont été sauvées."
            activities:
              - { type: learn }
              - { type: fill_blank, count: 2 }
              - { type: listen_select }
              - { type: speak }
              - type: dialogue
                scenario: reviewing_a_film_together
                goal: Discuss a film you both saw, giving your opinion on the plot, the direction and the acting.

    checkpoint:
      title: B2 Checkpoint
      required_score: 80
      activities:
        - { type: word_select, count: 3 }
        - { type: fill_blank, count: 3 }
        - { type: error_correct, count: 2 }
        - { type: listen_select, count: 3 }
        - { type: translate, count: 3 }
        - { type: dialogue }

  C1:
    title: Advanced
    description: >
      Understand demanding, longer texts and recognise implicit meaning, express yourself fluently and spontaneously, and use French flexibly and effectively for social, academic and professional purposes.

    units:
      - id: maitrise-subjonctif
        title: Subjunctive Mastery
        description: Use the subjunctive with confidence in complex and nuanced sentences.
        icon: 🎯
        steps:
          - id: subjonctif-passe
            title: The Past Subjunctive
            description: Express feelings and judgements about completed actions with the subjonctif passé.
            vocabulary: ["être ravi que", "regretter que", "s'étonner que", "il est dommage que", "douter que", "avoir peur que", "je suis content que", "il est possible que"]
            grammar:
              - pattern: "Je suis ravi que tu sois venu."
              - pattern: "Je regrette qu'elle ne m'ait pas prévenu."
              - pattern: "Il est dommage qu'ils soient partis si tôt."
            activities:
              - { type: learn, count: 2 }
              - { type: fill_blank, count: 2 }
              - { type: error_correct, count: 2 }
              - { type: translate }
          - id: subjonctif-relatives
            title: Subjunctive in Relative Clauses
            description: Use the subjunctive after superlatives, le seul, le premier, rien and personne, and for sought-after antecedents.
            vocabulary: ["le meilleur … que", "le seul qui", "le premier qui", "l'unique", "il n'y a rien qui", "je ne connais personne qui", "chercher quelqu'un qui", "un endroit où"]
            grammar:
              - pattern: "C'est le meilleur film que j'aie vu."
              - pattern: "Je cherche quelqu'un qui puisse m'aider."
              - pattern: "Il n'y a rien qui me fasse plus plaisir."
            activities:
              - { type: learn, count: 2 }
              - { type: sentence_complete, count: 2 }
              - { type: multiple_choice, count: 2 }
              - { type: error_correct }
              - { type: translate }
          - id: conjonctions-ne-expletif
            title: À moins que, sans que, pourvu que
            description: Use conjunctions that take the subjunctive, with the ne explétif where it belongs.
            vocabulary: ["à moins que", "sans que", "pourvu que", "de peur que", "de crainte que", "avant que", "en attendant que", "le ne explétif"]
            grammar:
              - pattern: "Nous partirons demain, à moins qu'il ne pleuve."
              - pattern: "Il est sorti sans que personne s'en aperçoive."
              - pattern: "Pourvu qu'il fasse beau ce week-end !"
            activities:
              - { type: learn, count: 2 }
              - { type: fill_blank, count: 2 }
              - { type: word_bank, count: 2 }
              - { type: listen_type }
          - id: que-subjonctif-independant
            title: Que + Subjunctive on Its Own
            description: Give orders and wishes with que + subjunctive and express indifference with que … ou non.
            vocabulary: ["qu'il entre !", "que la fête commence !", "qu'il le veuille ou non", "que ce soit … ou", "soit !", "vive …", "ainsi soit-il", "advienne que pourra"]
            grammar:
              - pattern: "Qu'il entre !"
              - pattern: "Qu'il le veuille ou non, il devra signer."
              - pattern: "Que ce soit à Paris ou à Lyon, les loyers augmentent."
            activities:
              - { type: learn }
              - { type: fill_blank, count: 2 }
              - { type: error_correct }
              - { type: speak }
              - type: dialogue
                scenario: organising_a_surprise_party
                goal: Agree on the party plan, setting conditions and wishes with the subjunctive.

      - id: mise-en-relief-ordre
        title: Emphasis & Word Order
        description: Highlight information through cleft sentences, dislocation and inversion.
        icon: 🔦
        steps:
          - id: ce-qui-ce-que-cest
            title: Ce qui … c'est
            description: Put the key idea in focus with ce qui, ce que and ce dont … c'est.
            vocabulary: ["ce qui me gêne", "ce que j'aime", "ce dont j'ai besoin", "c'est … qui", "c'est … que", "ce qui compte", "l'essentiel", "le problème"]
            grammar:
              - pattern: "Ce qui me gêne, c'est son manque de franchise."
              - pattern: "Ce dont j'ai besoin, c'est d'un peu de calme."
              - pattern: "C'est elle qui a eu l'idée, pas moi."
            activities:
              - { type: learn, count: 2 }
              - { type: sentence_complete, count: 2 }
              - { type: word_bank, count: 2 }
              - { type: translate }
          - id: dislocation-emphase
            title: Left and Right Dislocation
            description: Front or postpone a topic and pick it up again with a pronoun.
            vocabulary: ["moi", "toi", "lui", "eux", "ce film", "ça", "en", "y"]
            grammar:
              - pattern: "Moi, ce film, je l'ai adoré."
              - pattern: "Il est fou, ce type."
              - pattern: "Du chocolat, j'en mange tous les jours."
            activities:
              - { type: learn, count: 2 }
              - { type: error_correct, count: 2 }
              - { type: listen_select, count: 2 }
              - { type: translate }
          - id: inversion-adverbes
            title: Inversion after Adverbs
            description: Invert the subject after peut-être, aussi, sans doute and à peine in formal French.
            vocabulary: ["peut-être", "sans doute", "aussi", "à peine", "ainsi", "du moins", "encore", "toujours est-il que"]
            grammar:
              - pattern: "Peut-être viendra-t-il ce soir."
              - pattern: "À peine était-elle arrivée que le téléphone a sonné."
              - pattern: "Le projet était trop cher ; aussi a-t-il été abandonné."
            activities:
              - { type: learn, count: 2 }
              - { type: fill_blank, count: 2 }
              - { type: error_correct, count: 2 }
              - { type: multiple_choice }
          - id: ne-que-restriction
            title: Ne … que and Restriction
            description: Restrict and emphasise with ne … que, seulement and il n'y a que.
            vocabulary: ["ne … que", "seulement", "uniquement", "il n'y a que", "rien que", "ne faire que", "tout au plus", "pas plus de"]
            grammar:
              - pattern: "Je n'ai que dix minutes à te consacrer."
              - pattern: "Il n'y a que toi qui puisses le convaincre."
              - pattern: "Il ne fait que se plaindre."
            activities:
              - { type: learn }
              - { type: fill_blank, count: 2 }
              - { type: word_select, count: 2 }
              - type: dialogue
                scenario: film_club_debate
                goal: Defend your favourite film using emphasis, dislocation and restriction to stress your points.

      - id: structures-avancees
        title: Advanced Structures
        description: Write compact, elegant sentences with participles, past infinitives and formal negation.
        icon: 🏛️
        steps:
          - id: participe-passe-compose
            title: The Perfect Participle
            description: Show that one action precedes another with ayant or étant + past participle.
            vocabulary: ["ayant terminé", "étant arrivé", "s'étant levée", "ayant compris", "n'ayant pas reçu", "étant donné", "une fois", "aussitôt"]
            grammar:
              - pattern: "Ayant terminé son rapport, il est parti."
              - pattern: "Étant arrivée en retard, elle a manqué le début."
              - pattern: "N'ayant pas reçu de réponse, je me permets de vous relancer."
            activities:
              - { type: learn, count: 2 }
              - { type: fill_blank, count: 2 }
              - { type: error_correct }
              - { type: translate, count: 2 }
          - id: proposition-participiale
            title: Absolute Participle Clauses
            description: Use participle clauses with their own subject to set the scene concisely.
            vocabulary: ["le travail fini", "la réunion terminée", "les invités partis", "le soleil couché", "toutes choses égales", "cela dit", "ceci fait", "la nuit tombée"]
            grammar:
              - pattern: "Le travail fini, ils sont sortis."
              - pattern: "La nuit tombée, le village s'endormit."
              - pattern: "Les invités partis, nous avons enfin pu nous reposer."
            activities:
              - { type: learn, count: 2 }
              - { type: word_bank, count: 2 }
              - { type: multiple_choice, count: 2 }
              - { type: listen_type }
          - id: infinitif-passe
            title: The Past Infinitive
            description: Sequence actions with après avoir, sans avoir and other past infinitives.
            vocabulary: ["après avoir", "après être", "sans avoir", "pour avoir", "regretter d'avoir", "être sûr d'avoir", "se souvenir d'avoir", "avant de"]
            grammar:
              - pattern: "Après avoir dîné, nous sommes allés au cinéma."
              - pattern: "Il est parti sans avoir dit au revoir."
              - pattern: "Elle a été félicitée pour avoir sauvé un enfant."
            activities:
              - { type: learn, count: 2 }
              - { type: fill_blank, count: 2 }
              - { type: error_correct, count: 2 }
              - { type: translate }
          - id: ne-sans-pas-soutenu
            title: Ne Without Pas
            description: Recognise and use ne alone and the ne explétif in formal written French.
            vocabulary: ["je n'ose", "je ne saurais", "je ne cesse de", "si je ne me trompe", "il ne peut", "plus … que je ne", "craindre que … ne", "je ne sais"]
            grammar:
              - pattern: "Je n'ose le dire."
              - pattern: "Si je ne me trompe, la séance est levée."
              - pattern: "Il est plus intelligent qu'il ne le paraît."
            activities:
              - { type: learn }
              - { type: multiple_choice, count: 2 }
              - { type: error_correct, count: 2 }
              - type: dialogue
                scenario: formal_literary_reading
