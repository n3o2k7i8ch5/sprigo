      - id: le-futur-simple
        title: The Future
        description: Talk about the future, conditions and plans with the futur simple.
        icon: 🔮
        steps:
          - id: futur-simple-reguliers
            title: Will Do
            description: Form the futur simple of regular verbs from the infinitive.
            vocabulary: [parler, finir, prendre, "je parlerai", "tu finiras", "il prendra", demain, "l'année prochaine", "un jour"]
            grammar:
              - pattern: "L'année prochaine, je parlerai mieux français."
              - pattern: "Nous finirons le projet demain."
              - pattern: "Ils prendront le train à huit heures."
            activities:
              - { type: learn, count: 3 }
              - { type: fill_blank, count: 2 }
              - { type: word_select, count: 2 }
              - { type: listen_select, count: 2 }
          - id: futur-irregulier
            title: Irregular Futures
            description: Learn the irregular stems aur-, ser-, fer-, ir-, pourr- and viendr-.
            vocabulary: ["j'aurai", "je serai", "je ferai", "j'irai", "je pourrai", "je viendrai", "je verrai", "il faudra"]
            grammar:
              - pattern: "Demain, il fera beau."
              - pattern: "Je serai à la maison ce soir."
              - pattern: "Tu viendras à ma fête samedi ?"
            activities:
              - { type: learn, count: 2 }
              - { type: multiple_choice, count: 2 }
              - { type: error_correct, count: 2 }
              - { type: translate }
          - id: si-present-futur
            title: If This, Then That
            description: Talk about real conditions with si + présent + futur.
            vocabulary: [si, "s'il pleut", "s'il fait beau", "avoir le temps", "rester à la maison", "aller à la plage"]
            grammar:
              - pattern: "S'il fait beau, nous irons à la plage."
              - pattern: "Si j'ai le temps, je t'appellerai."
              - pattern: "Si tu viens, on fera un gâteau."
            activities:
              - { type: learn, count: 2 }
              - { type: sentence_complete, count: 2 }
              - { type: word_bank, count: 2 }
              - { type: error_correct }
          - id: quand-futur-projets
            title: Plans & Hopes
            description: Use quand + futur and talk about hopes and intentions.
            vocabulary: [quand, espérer, "avoir l'intention de", "avoir envie de", "plus tard", "dans cinq ans", "trouver un travail", "déménager"]
            grammar:
              - pattern: "Quand je serai grand, je serai pilote."
              - pattern: "J'espère que tu pourras venir."
              - pattern: "J'ai l'intention de déménager à Lyon."
            activities:
              - { type: learn }
              - { type: fill_blank, count: 2 }
              - { type: listen_type }
              - { type: speak }
              - type: dialogue
