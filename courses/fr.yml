      - id: nuance-discours
        title: Hedging & Discourse
        description: Soften claims, structure arguments and reformulate ideas like a fluent speaker.
        icon: 🧭
        steps:
          - id: attenuation-conditionnel
            title: Softening with the Conditional
            description: Hedge statements with il semblerait que, on pourrait penser que and similar forms.
            vocabulary: ["il semblerait que", "on pourrait penser que", "il se pourrait que", "j'aurais tendance à", "on dirait que", "il paraîtrait que", "je serais tenté de", "à première vue"]
            grammar:
              - pattern: "Il semblerait que les résultats soient meilleurs que prévu."
              - pattern: "On pourrait penser que la crise est terminée."
              - pattern: "J'aurais tendance à croire qu'il a raison."
            activities:
              - { type: learn, count: 2 }
              - { type: sentence_complete, count: 2 }
              - { type: multiple_choice, count: 2 }
              - { type: translate }
          - id: modalisateurs
            title: Modalisers
            description: Qualify your statements with a priori, en quelque sorte and dans une certaine mesure.
            vocabulary: ["a priori", "en quelque sorte", "dans une certaine mesure", "plus ou moins", "en principe", "vraisemblablement", "à proprement parler", "jusqu'à un certain point"]
            grammar:
              - pattern: "A priori, rien ne s'oppose à ce projet."
              - pattern: "C'est, en quelque sorte, un retour aux sources."
              - pattern: "Dans une certaine mesure, je partage votre avis."
            activities:
              - { type: learn, count: 2 }
              - { type: match, count: 2 }
              - { type: fill_blank, count: 2 }
              - { type: listen_select }
          - id: connecteurs-certes-or
            title: Certes, en revanche, quant à, or
            description: Link and contrast ideas with key discourse markers.
            vocabulary: ["certes … mais", "d'ailleurs", "en revanche", "quant à", "or", "pourtant", "du reste", "en effet"]
            grammar:
              - pattern: "Certes, le projet est ambitieux, mais il reste réalisable."
              - pattern: "Quant à moi, je préfère attendre."
              - pattern: "Il devait venir ; or, personne ne l'a vu."
            activities:
              - { type: learn, count: 2 }
              - { type: word_select, count: 2 }
              - { type: error_correct, count: 2 }
              - { type: translate }
          - id: reformulation-autrement-dit
            title: Reformulating
            description: Clarify and rephrase with autrement dit, en d'autres termes and c'est-à-dire.
            vocabulary: ["autrement dit", "en d'autres termes", "c'est-à-dire", "à savoir", "en clair", "pour ainsi dire", "ou plutôt", "je veux dire par là"]
            grammar:
              - pattern: "Le budget est gelé, autrement dit, aucune embauche cette année."
              - pattern: "En d'autres termes, il faut tout recommencer."
              - pattern: "Il est parti, ou plutôt, il a été poussé vers la sortie."
            activities:
              - { type: learn }
              - { type: sentence_complete, count: 2 }
              - { type: word_bank, count: 2 }
              - type: dialogue
                scenario: explaining_a_complex_decision
                goal: Explain a nuanced decision to a colleague, hedging your claims and reformulating when they are confused.

