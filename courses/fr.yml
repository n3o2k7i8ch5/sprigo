  C2:
    title: Proficiency
    description: >
      Understand with ease virtually everything heard or read, summarise and reconstruct arguments from different sources, and express yourself spontaneously, fluently and precisely, distinguishing finer shades of meaning even in the most complex situations.

    units:
      - id: registres-de-langue
        title: Register & Nuance
        description: Move between formal, standard and colloquial French and pick the right register for every situation.
        icon: 🎚️
        steps:
          - id: soutenu-courant-familier
            title: Formal, Standard, Colloquial
            description: Recognise register triplets and the effect each word has on the listener.
            vocabulary: ["se rendre", "aller", "se barrer", "un ouvrage", "un livre", "un bouquin", "demeurer", "crécher", "un repas", "la bouffe"]
            grammar:
              - pattern: "Je me rends à Lyon demain pour affaires."
              - pattern: "Il a consacré un ouvrage remarquable à cette question."
              - pattern: "J'ai paumé mon bouquin dans le métro."
            activities:
              - { type: learn, count: 2 }
              - { type: match, count: 2 }
              - { type: multiple_choice, count: 2 }
              - { type: error_correct }
          - id: vouvoiement-tutoiement-nuances
            title: Tu vs Vous Subtleties
            description: Handle vouvoiement within families, tutoiement at work and the moment of switching.
            vocabulary: ["vouvoyer", "tutoyer", "se tutoyer", "le vouvoiement", "le tutoiement", "On peut se tutoyer ?", "garder ses distances", "la familiarité"]
            grammar:
              - pattern: "Dans certaines familles, les enfants vouvoient encore leurs grands-parents."
              - pattern: "Ici, tout le monde se tutoie, même la directrice."
              - pattern: "Je préférerais qu'on se vouvoie, si vous le permettez."
            activities:
              - { type: learn, count: 2 }
              - { type: multiple_choice, count: 2 }
              - { type: error_correct, count: 2 }
              - { type: translate }
          - id: interrogation-negation-soutenues
            title: Formal Questions & Negation
            description: Ask questions with inversion and use literary negation such as ne … point and ne … guère.
            vocabulary: ["Que voulez-vous ?", "Puis-je … ?", "Auriez-vous l'obligeance de", "Sauriez-vous", "Qu'en pensez-vous ?", "ne … point", "ne … guère", "nul ne"]
            grammar:
              - pattern: "Puis-je vous être utile en quoi que ce soit ?"
              - pattern: "Que voulez-vous dire exactement ?"
              - pattern: "Je ne saurais vous répondre ; nul ne le sait."
            activities:
              - { type: learn, count: 2 }
              - { type: word_bank, count: 2 }
              - { type: error_correct, count: 2 }
              - { type: listen_type }
          - id: registre-selon-situation
            title: Choosing the Right Register
            description: Adapt your register to a job interview, a formal letter and a chat with friends.
            vocabulary: ["Veuillez", "Je vous prie d'agréer", "Ça roule ?", "Ça marche", "être de mise", "déplacé", "malvenu", "convenir"]
            grammar:
              - pattern: "Ce genre de plaisanterie serait déplacé lors d'un entretien."
              - pattern: "Veuillez trouver ci-joint mon curriculum vitae."
              - pattern: "Salut, ça roule ? On se capte ce soir ?"
            activities:
              - { type: learn, count: 2 }
              - { type: sentence_complete, count: 2 }
              - { type: listen_select, count: 2 }
              - type: dialogue
                scenario: register_switching_day
                goal: Talk to your boss, a stranger and a close friend in turn, switching register naturally each time.

      - id: modalite-et-certitude
        title: Modality & Stance
        description: Express obligation, possibility and degrees of certainty with precision, including literary forms.
        icon: ⚖️
        steps:
          - id: devoir-pouvoir-falloir-nuances
            title: Devoir, Pouvoir, Falloir
            description: Use the fine nuances of modal verbs for regret, possibility and probability.
            vocabulary: ["il aurait dû", "il a dû", "il se peut que", "il n'est pas exclu que", "il faudrait que", "il doit s'agir de", "il ne tient qu'à vous", "il risque de"]
            grammar:
              - pattern: "Il aurait dû nous prévenir plus tôt."
              - pattern: "Il se peut qu'elle ait raison, après tout."
              - pattern: "Il n'est pas exclu que la réunion soit reportée."
            activities:
              - { type: learn, count: 2 }
              - { type: multiple_choice, count: 2 }
              - { type: fill_blank, count: 2 }
              - { type: translate }
          - id: subjonctif-imparfait-reconnaissance
            title: Imperfect & Pluperfect Subjunctive
            description: Recognise the imparfait and plus-que-parfait du subjonctif in literary and formal texts.
            vocabulary: ["qu'il fût", "qu'il eût", "qu'il fît", "qu'il vînt", "qu'elle sût", "qu'il pût", "qu'il eût fait", "qu'il fût venu"]
            grammar:
              - pattern: "Il fallait qu'il fût présent à la cérémonie."
              - pattern: "Je doutais qu'elle eût compris la leçon."
              - pattern: "Bien qu'il fût tard, il continua d'écrire."
            activities:
              - { type: learn, count: 2 }
              - { type: match, count: 2 }
              - { type: multiple_choice, count: 2 }
              - { type: error_correct }
          - id: conditionnel-passe-deuxieme-forme
            title: Literary Past Conditional
            description: Understand the conditionnel passé 2e forme, as in Il eût fallu, in literary French.
            vocabulary: ["il eût fallu", "on eût dit", "j'eusse aimé", "il eût été préférable", "n'eût été", "eût-il voulu", "le style soutenu", "la langue littéraire"]
            grammar:
              - pattern: "Il eût fallu agir bien plus tôt."
              - pattern: "On eût dit que le temps s'était arrêté."
              - pattern: "J'eusse aimé vous rencontrer en d'autres circonstances."
            activities:
              - { type: learn, count: 2 }
              - { type: word_select, count: 2 }
              - { type: error_correct, count: 2 }
              - { type: listen_select }
          - id: degres-de-certitude
            title: Degrees of Certainty
            description: Position yourself precisely between certainty, probability and doubt.
            vocabulary: ["il est indéniable que", "il est incontestable que", "rien ne permet d'affirmer que", "selon toute vraisemblance", "il y a fort à parier que", "il est douteux que", "à n'en pas douter", "il semblerait que"]
            grammar:
              - pattern: "Il est indéniable que la situation s'est améliorée."
              - pattern: "Rien ne permet d'affirmer que le suspect soit coupable."
              - pattern: "Il y a fort à parier qu'il ne viendra pas."
            activities:
              - { type: learn, count: 2 }
              - { type: sentence_complete, count: 2 }
              - { type: fill_blank }
              - type: dialogue
                scenario: expert_panel_certainty
                goal: Comment on a news story as an expert, carefully signalling how certain you are of each claim.

      - id: langage-figure
        title: Figurative Language
        description: Understand and use metaphors, idioms, proverbs and cultural references like a native speaker.
        icon: 🎭
        steps:
          - id: metaphore-comparaison
            title: Metaphor & Simile
            description: Tell metaphor from simile and use common figurative descriptions of people.
            vocabulary: ["être un ours", "comme un poisson dans l'eau", "un cœur de pierre", "une mer de nuages", "têtu comme une mule", "malin comme un singe", "la métaphore", "la comparaison"]
            grammar:
              - pattern: "Mon voisin est un vrai ours, il ne dit jamais bonjour."
              - pattern: "À Paris, elle est comme un poisson dans l'eau."
              - pattern: "Ce n'est plus une comparaison, c'est une métaphore filée."
            activities:
              - { type: learn, count: 2 }
              - { type: match, count: 2 }
              - { type: multiple_choice, count: 2 }
              - { type: translate }
          - id: expressions-animaux-corps
            title: Animal & Body Idioms
            description: Use idioms built on animals and parts of the body.
            vocabulary: ["avoir un chat dans la gorge", "se mettre le doigt dans l'œil", "poser un lapin", "avoir le cafard", "coûter les yeux de la tête", "avoir la chair de poule", "casser les pieds", "donner sa langue au chat"]
            grammar:
              - pattern: "Excusez-moi, j'ai un chat dans la gorge."
              - pattern: "Si tu crois qu'il va accepter, tu te mets le doigt dans l'œil."
              - pattern: "Elle m'a posé un lapin hier soir."
            activities:
              - { type: learn, count: 2 }
              - { type: image_select, count: 2 }
              - { type: fill_blank, count: 2 }
              - { type: error_correct }
          - id: proverbes-et-dictons
            title: Proverbs & Sayings
            description: Recognise well-known French proverbs and slip them into conversation.
            vocabulary: ["Qui vivra verra", "Petit à petit, l'oiseau fait son nid", "Qui ne risque rien n'a rien", "L'habit ne fait pas le moine", "Pierre qui roule n'amasse pas mousse", "vendre la peau de l'ours", "le proverbe", "le dicton"]
            grammar:
              - pattern: "Ne t'inquiète pas pour l'avenir : qui vivra verra."
              - pattern: "Il ne faut pas vendre la peau de l'ours avant de l'avoir tué."
              - pattern: "Comme dit le proverbe, l'habit ne fait pas le moine."
            activities:
              - { type: learn, count: 2 }
              - { type: sentence_complete, count: 2 }
              - { type: word_bank, count: 2 }
              - { type: listen_select }
          - id: madeleine-de-proust-tartuffe
            title: Literary & Historical Allusions
            description: Understand expressions drawn from French literature and history.
            vocabulary: ["une madeleine de Proust", "un vrai Tartuffe", "un Harpagon", "un Rastignac", "Après moi, le déluge", "le pot de terre contre le pot de fer", "une querelle de clocher", "la tour d'ivoire"]
            grammar:
              - pattern: "L'odeur du pain grillé, c'est ma madeleine de Proust."
              - pattern: "Ne te fie pas à ses beaux discours, c'est un vrai Tartuffe."
              - pattern: "Ce jeune ambitieux est un vrai Rastignac."
            activities:
              - { type: learn, count: 2 }
              - { type: match, count: 2 }
              - { type: multiple_choice }
              - type: dialogue
                scenario: literary_allusions_dinner
                goal: Follow and join a dinner conversation full of literary allusions without losing the thread.

      - id: rhetorique-persuasion
        title: Rhetoric & Persuasion
        description: Use figures of speech, understatement and eloquence to persuade and refute with elegance.
        icon: 🎤
        steps:
          - id: anaphore-gradation-antithese
            title: Figures of Speech
            description: Identify anaphora, gradation, antithesis and rhetorical questions in speeches.
            vocabulary: ["l'anaphore", "la gradation", "l'antithèse", "la question rhétorique", "le chiasme", "l'hyperbole", "l'énumération", "la prétérition"]
            grammar:
              - pattern: "Paris outragé ! Paris brisé ! Paris martyrisé ! mais Paris libéré !"
              - pattern: "Va, cours, vole, et nous venge."
              - pattern: "Faut-il vraiment rappeler que la liberté a un prix ?"
            activities:
              - { type: learn, count: 2 }
              - { type: match, count: 2 }
              - { type: multiple_choice, count: 2 }
              - { type: listen_select }
          - id: litote-euphemisme
            title: Litotes & Euphemism
            description: Say more by saying less, and soften harsh realities with euphemism.
            vocabulary: ["la litote", "l'euphémisme", "Ce n'est pas mal", "Va, je ne te hais point", "Il nous a quittés", "les personnes à mobilité réduite", "un demandeur d'emploi", "un non-voyant"]
            grammar:
              - pattern: "Va, je ne te hais point."
              - pattern: "Ce n'est pas mal du tout : c'est même excellent."
              - pattern: "Son grand-père nous a quittés l'hiver dernier."
            activities:
              - { type: learn, count: 2 }
              - { type: multiple_choice, count: 2 }
              - { type: error_correct, count: 2 }
              - { type: translate }
          - id: art-oratoire-eloquence
            title: The Art of the Speech
            description: Open, build and close a speech with eloquence.
            vocabulary: ["l'éloquence", "prendre la parole", "l'orateur", "l'exorde", "la péroraison", "capter l'attention", "haranguer", "un discours"]
            grammar:
              - pattern: "Permettez-moi de prendre la parole quelques instants."
              - pattern: "Un bon orateur sait capter l'attention dès l'exorde."
              - pattern: "Mesdames et Messieurs, si je suis devant vous ce soir, c'est pour vous parler d'avenir."
            activities:
              - { type: learn, count: 2 }
              - { type: word_bank, count: 2 }
              - { type: listen_type, count: 2 }
              - { type: speak }
          - id: refutation-elegante
            title: Refuting Elegantly
            description: Concede, nuance and refute an argument without being aggressive.
            vocabulary: ["certes … mais", "loin de moi l'idée de", "je me permets de nuancer", "force est de constater", "il n'en demeure pas moins que", "objecter", "réfuter", "l'argument d'autorité"]
            grammar:
              - pattern: "Loin de moi l'idée de vous contredire, mais les chiffres disent autre chose."
              - pattern: "Certes, l'argument est séduisant ; il n'en demeure pas moins fragile."
              - pattern: "Force est de constater que cette réforme n'a pas tenu ses promesses."
            activities:
              - { type: learn, count: 2 }
              - { type: sentence_complete, count: 2 }
              - { type: error_correct }
              - type: dialogue
                scenario: elegant_rebuttal_debate
                goal: Refute your opponent's arguments in a televised debate while staying courteous and precise.

      - id: humour-ironie-jeux-de-mots
        title: Humour, Irony & Wordplay
        description: Get the joke, catch the irony and appreciate French wit and wordplay.
        icon: 😏
        steps:
          - id: calembours-comble
            title: Puns & Wordplay
            description: Understand puns based on homophones and double meanings.
            vocabulary: ["un jeu de mots", "un calembour", "un homophone", "la polysémie", "un mot-valise", "le comble", "faire de l'esprit", "un trait d'esprit"]
            grammar:
              - pattern: "Quel est le comble pour un électricien ? Ne pas être au courant."
              - pattern: "Le comble pour un jardinier, c'est de raconter des salades."
              - pattern: "« Franglais » est un mot-valise formé de « français » et d'« anglais »."
            activities:
              - { type: learn, count: 2 }
              - { type: multiple_choice, count: 2 }
              - { type: match }
              - { type: listen_select, count: 2 }
          - id: ironie-antiphrase
            title: Irony & Antiphrasis
            description: Recognise irony and antiphrasis from context and tone of voice.
            vocabulary: ["l'ironie", "l'antiphrase", "Bravo, quelle réussite !", "C'est malin !", "Merci du cadeau !", "Charmant !", "pince-sans-rire", "le ton"]
            grammar:
              - pattern: "Bravo, quelle réussite ! Tu as encore raté le train."
              - pattern: "C'est malin ! Maintenant, on est enfermés dehors."
              - pattern: "Charmant accueil, vraiment… On se sent tout de suite chez soi."
            activities:
              - { type: learn, count: 2 }
              - { type: listen_select, count: 2 }
              - { type: multiple_choice, count: 2 }
              - { type: translate }
          - id: contrepeterie-reconnaitre
            title: Spoonerisms
            description: Recognise the contrepèterie, a French tradition of swapping sounds for a hidden meaning.
            vocabulary: ["la contrepèterie", "intervertir", "permuter", "une syllabe", "un son", "la solution", "le Canard enchaîné", "le sens caché"]
            grammar:
              - pattern: "Une contrepèterie consiste à intervertir des sons pour obtenir une autre phrase."
              - pattern: "« Sonnez, trompettes ! » devient, par contrepèterie, « Trompez, sonnettes ! »"
              - pattern: "Le jeu veut que le lecteur trouve la solution lui-même."
            activities:
              - { type: learn, count: 2 }
              - { type: word_select, count: 2 }
              - { type: multiple_choice }
              - { type: listen_type }
          - id: esprit-second-degre
            title: Wit & Second Degree
            description: Navigate l'esprit, le second degré, self-mockery and teasing.
            vocabulary: ["l'esprit", "le second degré", "prendre au premier degré", "une boutade", "l'autodérision", "l'humour noir", "taquiner", "chambrer"]
            grammar:
              - pattern: "Ne le prends pas mal, c'était du second degré."
              - pattern: "Il a répondu par une boutade pour détendre l'atmosphère."
              - pattern: "L'autodérision est souvent la marque d'un esprit fin."
            activities:
              - { type: learn, count: 2 }
              - { type: sentence_complete, count: 2 }
              - { type: error_correct }
              - type: dialogue
                scenario: second_degre_banter
                goal: Trade friendly teasing with French colleagues and show you can take and make a joke au second degré.

      - id: ecrit-administratif-academique
        title: Academic & Formal Writing
        description: Write in administrative, legal and academic French with precision and control.
        icon: 🏛️
        steps:
          - id: style-administratif-juridique
            title: Administrative & Legal Style
            description: Read and write the set phrases of official letters and contracts.
            vocabulary: ["Il est porté à votre connaissance que", "ci-après", "ci-joint", "nonobstant", "sous réserve de", "le cas échéant", "en vertu de", "dûment"]
            grammar:
              - pattern: "Il est porté à votre connaissance que le délai de recours est expiré."
              - pattern: "Nonobstant les dispositions qui précèdent, le contrat demeure valable."
              - pattern: "Le locataire, ci-après dénommé « le preneur », s'engage à payer le loyer."
            activities:
              - { type: learn, count: 2 }
              - { type: match, count: 2 }
              - { type: fill_blank, count: 2 }
              - { type: error_correct }
          - id: nominalisation-alleger
            title: Nominalisation & Its Alternatives
            description: Use nominalisation in formal prose and know when to lighten it with verbs.
            vocabulary: ["la nominalisation", "la mise en œuvre", "la prise en charge", "le renforcement", "la suppression", "l'amélioration", "alléger le style", "un verbe d'action"]
            grammar:
              - pattern: "La mise en œuvre de la réforme a entraîné une hausse des coûts."
              - pattern: "Plus simplement : depuis qu'on applique la réforme, les coûts augmentent."
              - pattern: "La suppression de ces postes a provoqué la colère des syndicats."
            activities:
              - { type: learn, count: 2 }
              - { type: word_bank, count: 2 }
              - { type: error_correct, count: 2 }
              - { type: translate }
          - id: synthese-de-documents
            title: Document Synthesis & Summary
            description: Apply the techniques of the synthèse de documents and the résumé.
            vocabulary: ["la synthèse de documents", "le résumé", "la contraction de texte", "le corpus", "la problématique", "confronter", "dégager les idées principales", "rester objectif"]
            grammar:
              - pattern: "Les trois documents du corpus abordent la question sous des angles différents."
              - pattern: "Alors que le premier auteur insiste sur le coût, le second met l'accent sur l'éthique."
              - pattern: "Le résumé doit respecter l'ordre des idées du texte original."
            activities:
              - { type: learn, count: 2 }
              - { type: sentence_complete, count: 2 }
              - { type: multiple_choice }
              - { type: listen_type }
          - id: or-partant-a-fortiori
            title: Precise Connectors
            description: Link ideas rigorously with or, partant, en l'occurrence and a fortiori.
            vocabulary: ["or", "partant", "en l'occurrence", "a fortiori", "dès lors", "du reste", "en revanche", "toutefois"]
            grammar:
              - pattern: "Tout homme est mortel ; or Socrate est un homme."
              - pattern: "Il a menti à plusieurs reprises ; partant, sa parole n'a plus de valeur."
              - pattern: "Cette tâche est ardue pour un expert, a fortiori pour un débutant."
            activities:
              - { type: learn, count: 2 }
              - { type: fill_blank, count: 2 }
              - { type: error_correct }
              - type: dialogue
                scenario: thesis_supervisor_meeting
                goal: Discuss your draft synthesis with your supervisor and justify your choice of connectors.

      - id: litterature-et-style-narratif
        title: Literature & Style
        description: Read classic French narrative tenses and analyse literary texts and poetry.
        icon: 📜
        steps:
          - id: passe-simple-passe-anterieur
            title: Passé Simple & Passé Antérieur
            description: Recognise the narrative tenses of written French and the sequence they create.
            vocabulary: ["il entra", "elle fut", "ils eurent", "elle vint", "il dit", "ils prirent", "dès qu'il eut fini", "à peine fut-elle sortie"]
            grammar:
              - pattern: "Il entra dans la pièce et s'assit sans un mot."
              - pattern: "Elle prit la lettre, la lut, puis la déchira."
              - pattern: "Dès qu'il eut fini son discours, la salle se leva."
            activities:
              - { type: learn, count: 2 }
              - { type: match, count: 2 }
              - { type: multiple_choice, count: 2 }
              - { type: error_correct }
          - id: style-indirect-libre
            title: Free Indirect Speech
            description: Spot free indirect speech and distinguish it from direct and reported speech.
            vocabulary: ["le style indirect libre", "le discours direct", "le discours indirect", "la focalisation interne", "le monologue intérieur", "les pensées du personnage", "rapporter", "la voix narrative"]
            grammar:
              - pattern: "Elle regarda par la fenêtre. Viendrait-il enfin ? Elle n'en pouvait plus d'attendre."
              - pattern: "Il annonça qu'il partirait le lendemain."
              - pattern: "Il partirait demain, c'était décidé ; personne ne le retiendrait."
            activities:
              - { type: learn, count: 2 }
              - { type: multiple_choice, count: 2 }
              - { type: word_bank, count: 2 }
              - { type: translate }
          - id: analyse-narrateur-registre
            title: Analysing a Text
            description: Discuss the narrator, point of view and literary register of a passage.
            vocabulary: ["le narrateur", "le point de vue", "omniscient", "le registre lyrique", "le registre tragique", "le registre comique", "le champ lexical", "l'incipit"]
            grammar:
              - pattern: "Le narrateur omniscient connaît les pensées de tous les personnages."
              - pattern: "Le champ lexical de la mort renforce le registre tragique de la scène."
              - pattern: "Dans cet incipit, le point de vue adopté est celui du héros."
            activities:
              - { type: learn, count: 2 }
              - { type: sentence_complete, count: 2 }
              - { type: match }
              - { type: listen_select }
          - id: alexandrin-rime
            title: Poetry Basics
            description: Count syllables in an alexandrine and describe rhyme and form.
            vocabulary: ["l'alexandrin", "le vers", "la strophe", "la rime", "la césure", "l'hémistiche", "le sonnet", "les rimes embrassées"]
            grammar:
              - pattern: "Un alexandrin compte douze syllabes."
              - pattern: "La césure partage l'alexandrin en deux hémistiches."
              - pattern: "Demain, dès l'aube, à l'heure où blanchit la campagne"
            activities:
              - { type: learn, count: 2 }
              - { type: listen_type, count: 2 }
              - { type: multiple_choice }
              - type: dialogue
                scenario: literature_class_commentary
                goal: Present a short commentary on a poem to your class and answer the teacher's questions.

      - id: idees-et-philosophie
        title: Ideas & Philosophy
        description: Discuss abstract ideas, quote famous thinkers and argue with subtle concession.
        icon: 🦉
        steps:
          - id: etre-conscience-libre-arbitre
            title: Abstract Vocabulary
            description: Talk about being, consciousness, freedom and free will.
            vocabulary: ["l'être", "le néant", "la conscience", "la liberté", "le libre arbitre", "l'essence", "l'existence", "autrui", "le déterminisme"]
            grammar:
              - pattern: "Le libre arbitre n'est-il qu'une illusion ?"
              - pattern: "Pour Sartre, l'existence précède l'essence."
              - pattern: "Avoir conscience de soi, c'est déjà se distinguer d'autrui."
            activities:
              - { type: learn, count: 2 }
              - { type: match, count: 2 }
              - { type: fill_blank, count: 2 }
              - { type: translate }
          - id: cogito-citations-celebres
            title: Famous Quotations
            description: Recognise and use famous quotations from French thinkers.
            vocabulary: ["Je pense, donc je suis", "L'enfer, c'est les autres", "L'homme est un roseau pensant", "Il faut cultiver notre jardin", "le cogito", "une citation", "citer", "selon l'auteur"]
            grammar:
              - pattern: "Descartes affirme : « Je pense, donc je suis. »"
              - pattern: "Quand Sartre écrit que l'enfer, c'est les autres, il parle du regard d'autrui."
              - pattern: "Selon Pascal, l'homme n'est qu'un roseau, mais c'est un roseau pensant."
            activities:
              - { type: learn, count: 2 }
              - { type: multiple_choice, count: 2 }
              - { type: listen_select, count: 2 }
              - { type: error_correct }
          - id: argumenter-sur-l-abstrait
            title: Arguing About Ideas
            description: Build a philosophical argument with distinctions, thesis and antithesis.
            vocabulary: ["il convient de distinguer", "a priori", "en tant que tel", "la thèse", "l'antithèse", "dépasser la contradiction", "en dernière analyse", "poser le problème"]
            grammar:
              - pattern: "Il convient de distinguer la liberté de droit et la liberté de fait."
              - pattern: "A priori, le bonheur semble dépendre des circonstances."
              - pattern: "En dernière analyse, toute morale repose sur un choix."
            activities:
              - { type: learn, count: 2 }
              - { type: word_bank, count: 2 }
              - { type: sentence_complete, count: 2 }
              - { type: speak }
          - id: quand-bien-meme-tout-que
            title: Concessive Structures
            description: Concede with pour autant, quand bien même + conditional and tout … que.
            vocabulary: ["pour autant", "quand bien même", "tout … que", "si … que", "quelque … que", "encore que", "il n'empêche que", "toujours est-il que"]
            grammar:
              - pattern: "Quand bien même il s'excuserait, je ne lui pardonnerais pas."
              - pattern: "Tout intelligent qu'il est, il s'est trompé."
              - pattern: "Elle a échoué ; elle n'a pas renoncé pour autant."
            activities:
              - { type: learn, count: 2 }
              - { type: fill_blank, count: 2 }
              - { type: error_correct }
              - type: dialogue
                scenario: cafe_philo_debate
                goal: Defend a position on free will at a café philo while conceding the strongest objections.

      - id: francophonie-et-identite
        title: Culture, Language & Identity
        description: Explore the French-speaking world, its regional varieties and current debates about the language.
        icon: 🌍
        steps:
          - id: belgique-suisse-septante
            title: Belgium & Switzerland
            description: Recognise Belgian and Swiss French, from septante and nonante to meal names.
            vocabulary: ["la francophonie", "septante", "huitante", "nonante", "le dîner (midi)", "le souper", "une drache", "Ça joue ?"]
            grammar:
              - pattern: "En Belgique et en Suisse, on dit septante et nonante."
              - pattern: "À Bruxelles, on dîne à midi et on soupe le soir."
              - pattern: "Il drache depuis ce matin, prends ton parapluie !"
            activities:
              - { type: learn, count: 2 }
              - { type: listen_select, count: 2 }
              - { type: match, count: 2 }
              - { type: multiple_choice }
          - id: quebec-magasiner-char
            title: Quebec French
            description: Understand everyday Quebec French and its distinctive vocabulary.
            vocabulary: ["un char", "magasiner", "C'est plate", "la fin de semaine", "mon chum", "ma blonde", "C'est correct", "le dépanneur"]
