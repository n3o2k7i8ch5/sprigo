              - pattern: "La question de la fin de vie divise la société."
              - pattern: "Il convient de prévenir les dérives de la génétique."
            activities:
              - { type: learn, count: 2 }
              - { type: fill_blank, count: 2 }
              - { type: multiple_choice, count: 2 }
              - { type: translate }
          - id: encore-faut-il
            title: Expressing Reservations
            description: Voice doubts with encore faut-il que, reste à savoir si and similar structures.
            vocabulary: ["encore faut-il que", "reste à savoir si", "rien ne garantit que", "on peut se demander si", "sous réserve que", "à condition que", "un bémol", "émettre des réserves"]
            grammar:
              - pattern: "L'idée est bonne ; encore faut-il qu'elle soit appliquée."
              - pattern: "Reste à savoir si le public suivra."
