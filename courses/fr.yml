        icon: ⚖️
        steps:
          - id: plus-moins-aussi-que
            title: More, Less, As
            description: Compare adjectives with plus, moins and aussi … que.
            vocabulary: [grand, petit, cher, "bon marché", rapide, lent, "plus … que", "moins … que", "aussi … que"]
            grammar:
              - pattern: "Paris est plus grand que Lyon."
              - pattern: "Le train est moins cher que l'avion."
              - pattern: "Ma sœur est aussi grande que moi."
            activities:
              - { type: learn, count: 3 }
              - { type: word_select, count: 2 }
              - { type: fill_blank, count: 2 }
              - { type: listen_select, count: 2 }
          - id: meilleur-ou-mieux
            title: Better
            description: Use meilleur with nouns and mieux with verbs.
            vocabulary: [bon, bonne, meilleur, meilleure, bien, mieux, mauvais, pire]
            grammar:
              - pattern: "Ce gâteau est meilleur que l'autre."
              - pattern: "Elle chante mieux que moi."
              - pattern: "Les vacances à la mer sont meilleures."
            activities:
              - { type: learn, count: 2 }
              - { type: multiple_choice, count: 2 }
              - { type: error_correct, count: 2 }
              - { type: translate }
          - id: autant-de-que
            title: As Much As
            description: Compare quantities and actions with autant (de) … que.
            vocabulary: ["plus de", "moins de", "autant de", autant, "le temps", "l'argent", "les amis", "le travail"]
            grammar:
              - pattern: "J'ai autant de livres que toi."
              - pattern: "Il travaille autant que son frère."
              - pattern: "Nous avons moins de temps que vous."
            activities:
              - { type: learn, count: 2 }
              - { type: word_bank, count: 2 }
              - { type: sentence_complete, count: 2 }
              - { type: listen_type }
          - id: superlatif-le-plus
            title: The Best of All
            description: Say what is the most or the least with le/la/les plus … de.
            vocabulary: ["le plus", "la plus", "les plus", "le moins", "le meilleur", "la meilleure", "du monde", "de la ville"]
            grammar:
              - pattern: "C'est la plus belle ville du monde."
              - pattern: "C'est le restaurant le moins cher du quartier."
              - pattern: "Marie est la meilleure élève de la classe."
            activities:
              - { type: learn }
              - { type: fill_blank, count: 2 }
              - { type: translate, count: 2 }
              - type: dialogue
                scenario: comparing_cities
                goal: Compare two cities and say which one you prefer and why.

      - id: aux-magasins
        title: At the Shops
