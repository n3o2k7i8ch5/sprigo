# Spanish course. Hierarchy: levels (CEFR) > units > steps > activities.
# Activities name only a type (+ optional count and hints like scenario/goal); the AI writes the content
# from the step's title, description, vocabulary, grammar and the level. Types: see src/course.ts.
name: Spanish
native_name: Español
iso: es
flag: 🇪🇸

levels:
  A1:
    title: Beginner
    description: >
      Understand and use familiar everyday expressions and very basic phrases.

    units:
      - id: greetings
        title: Greetings & Introductions
        description: Meet people and introduce yourself.
        icon: 👋
        steps:
          - id: basic-greetings
            title: Basic Greetings
            description: Common ways to greet people.
            vocabulary: [hola, adiós, "buenos días", "buenas tardes", "buenas noches", "hasta luego", "hasta mañana"]
            grammar:
              - pattern: "¡Buenos días!"
              - pattern: "¡Hola! ¿Qué tal?"
            activities:
              - { type: learn, count: 3 }
              - { type: word_select, count: 2 }
              - { type: match }
              - { type: listen_select, count: 2 }
              - { type: speak }
          - id: introduce-yourself
            title: Introduce Yourself
            description: Tell someone your name, where you are from and ask theirs.
            vocabulary: [llamarse, "el nombre", soy, "mucho gusto", encantado, encantada, "de dónde"]
            grammar:
              - pattern: "Me llamo {name}."
              - pattern: "¿Cómo te llamas?"
              - pattern: "Soy de México."
              - pattern: "Mucho gusto."
            activities:
              - { type: learn, count: 2 }
              - { type: translate, count: 2 }
              - { type: fill_blank, count: 2 }
              - { type: word_bank, count: 2 }
              - type: dialogue
                scenario: meeting_someone
                goal: Greet the person, introduce yourself, say where you are from and ask their name.
          - id: how-are-you
            title: How Are You?
            description: Ask and answer how someone is, using estar.
            vocabulary: [bien, mal, "muy bien", regular, cansado, cansada, gracias, "¿y tú?"]
            grammar:
              - pattern: "¿Cómo estás?"
              - pattern: "Estoy bien, gracias. ¿Y tú?"
              - pattern: "Estoy un poco cansado."
            activities:
              - { type: learn, count: 2 }
              - { type: multiple_choice, count: 2 }
              - { type: word_bank, count: 2 }
              - { type: listen_type }
              - type: dialogue
                scenario: friend_on_the_street
          - id: polite-words
            title: Please & Thank You
            description: Be polite in everyday situations.
            vocabulary: ["por favor", gracias, "de nada", "lo siento", perdón, "con permiso"]
            activities:
              - { type: learn, count: 2 }
              - { type: word_select, count: 2 }
              - { type: match }
              - { type: sentence_complete, count: 2 }
              - { type: listen_select }

      - id: numbers-colors
        title: Numbers & Colors
        description: Count, say your age and name colors.
        icon: 🔢
        steps:
          - id: numbers-1-10
            title: Numbers 1–10
            vocabulary: [uno, dos, tres, cuatro, cinco, seis, siete, ocho, nueve, diez]
            activities:
              - { type: learn, count: 3 }
              - { type: match }
              - { type: listen_select, count: 2 }
              - { type: listen_type }
          - id: numbers-11-100
            title: Numbers 11–100
            vocabulary: [once, doce, quince, dieciséis, veinte, veintiuno, treinta, "treinta y uno", cincuenta, cien]
            activities:
              - { type: learn, count: 2 }
              - { type: word_select, count: 2 }
              - { type: listen_type, count: 2 }
              - { type: match }
          - id: how-old
            title: How Old Are You?
            description: Say your age with tener.
            vocabulary: [tener, tengo, tienes, tiene, "el año", "los años"]
            grammar:
              - pattern: "Tengo {number} años."
              - pattern: "¿Cuántos años tienes?"
              - pattern: "Mi hermano tiene {number} años."
            activities:
              - { type: learn }
              - { type: word_bank, count: 2 }
              - { type: translate, count: 2 }
              - { type: error_correct }
          - id: colors
            title: Basic Colors
            description: Colors and how they agree with the noun.
            vocabulary: [rojo, azul, verde, amarillo, negro, blanco, naranja, marrón, "el color"]
            grammar:
              - pattern: "El coche es rojo."
              - pattern: "La casa es blanca."
              - pattern: "¿De qué color es?"
            activities:
              - { type: learn, count: 2 }
              - { type: image_select, count: 3 }
              - { type: match }
              - { type: fill_blank }
              - { type: listen_select }

      - id: people-family
        title: Family & People
        description: Talk about your family and describe people.
        icon: 👨‍👩‍👧
        steps:
          - id: family-members
            title: Family Members
            vocabulary: ["la madre", "el padre", "la hermana", "el hermano", "el hijo", "la hija", "los padres", "la familia"]
            grammar:
              - pattern: "Mi madre se llama {name}."
              - pattern: "¿Tienes hermanos?"
            activities:
              - { type: learn, count: 3 }
              - { type: match }
              - { type: word_select, count: 2 }
              - { type: listen_select }
          - id: gender-articles
            title: El, La, Un, Una
            description: Masculine and feminine nouns, articles and plurals.
            vocabulary: [el, la, los, las, un, una, unos, unas, "el chico", "la chica"]
            grammar:
              - pattern: "Es un chico. Es una chica."
              - pattern: "el libro → los libros"
              - pattern: "la mesa → las mesas"
            activities:
              - { type: learn, count: 2 }
              - { type: fill_blank, count: 3 }
              - { type: error_correct, count: 2 }
              - { type: word_bank }
          - id: ser-estar
            title: Ser & Estar
            description: Describe what people are like (ser) and how they are now (estar).
            vocabulary: [alto, bajo, joven, simpático, contento, cansado, "el pelo", "los ojos"]
            grammar:
              - pattern: "Ella es alta y simpática."
              - pattern: "Hoy él está cansado."
              - pattern: "Tiene los ojos marrones."
            activities:
              - { type: learn, count: 2 }
              - { type: multiple_choice, count: 2 }
              - { type: image_select, count: 2 }
              - { type: sentence_complete, count: 2 }
              - { type: error_correct }
          - id: pets
            title: Pets & Animals
            vocabulary: ["el perro", "el gato", "el pájaro", "el pez", "el caballo", "la mascota"]
            grammar:
              - pattern: "Tengo un perro."
              - pattern: "¿Tienes mascota?"
              - pattern: "Mi gato es negro."
            activities:
              - { type: learn, count: 2 }
              - { type: image_select, count: 2 }
              - { type: word_bank, count: 2 }
              - { type: listen_type }

      - id: food-drink
        title: Food & Drink
        description: Order at a café and talk about what you like.
        icon: 🍎
        steps:
          - id: food-basics
            title: Food Basics
            vocabulary: ["el pan", "la manzana", "el huevo", "el queso", "el arroz", "el pollo", "la sopa", "la ensalada"]
            activities:
              - { type: learn, count: 3 }
              - { type: image_select, count: 2 }
              - { type: match }
              - { type: listen_select }
          - id: drinks
            title: Drinks
            vocabulary: ["el agua", "el café", "el té", "la leche", "el zumo", "el vaso", "la taza"]
            grammar:
              - pattern: "Un té, por favor."
              - pattern: "Un vaso de agua, por favor."
            activities:
              - { type: learn, count: 2 }
              - { type: word_select, count: 2 }
              - { type: fill_blank, count: 2 }
              - { type: listen_type }
          - id: gustar
            title: Me Gusta, No Me Gusta
            description: Say what you like with gustar (me gusta / me gustan).
            vocabulary: [gustar, encantar, "me gusta", "me gustan", favorito, rico]
            grammar:
              - pattern: "Me gusta el café."
              - pattern: "No me gustan las manzanas."
              - pattern: "¿Te gusta el té?"
            activities:
              - { type: learn, count: 2 }
              - { type: word_bank, count: 2 }
              - { type: error_correct, count: 2 }
              - { type: translate, count: 2 }
          - id: at-the-cafe
            title: At the Café
            description: Order with querer and ask for the bill.
            vocabulary: ["la carta", pedir, "la cuenta", "el precio", "cuánto", querer]
            grammar:
              - pattern: "Quiero un café con leche, por favor."
              - pattern: "¿Cuánto es?"
              - pattern: "La cuenta, por favor."
            activities:
              - { type: learn, count: 2 }
              - { type: sentence_complete, count: 2 }
              - { type: listen_select }
              - type: dialogue
                scenario: ordering_at_a_cafe
                goal: Order a drink and a snack, then ask for the bill.

      - id: daily-routine
        title: Daily Routine
        description: Time, days and what you do every day.
        icon: ⏰
        steps:
          - id: telling-time
            title: Telling the Time
            vocabulary: ["la hora", "y media", "y cuarto", "menos cuarto", "en punto", "es la una", "son las"]
            grammar:
              - pattern: "¿Qué hora es?"
              - pattern: "Son las siete y media."
              - pattern: "Es la una en punto."
            activities:
              - { type: learn, count: 2 }
              - { type: multiple_choice, count: 2 }
              - { type: listen_type, count: 2 }
          - id: days-of-week
            title: Days of the Week
            vocabulary: [lunes, martes, miércoles, jueves, viernes, sábado, domingo, "el fin de semana", hoy, mañana]
            grammar:
              - pattern: "Hoy es lunes."
              - pattern: "Los sábados no trabajo."
            activities:
              - { type: learn, count: 2 }
              - { type: match }
              - { type: fill_blank, count: 2 }
              - { type: listen_select }
          - id: reflexive-routine
            title: My Morning (Reflexive Verbs)
            description: Talk about your morning with me levanto, me ducho…
            vocabulary: [despertarse, levantarse, ducharse, vestirse, "el desayuno", desayunar]
            grammar:
              - pattern: "Me levanto a las siete."
              - pattern: "Me ducho y desayuno."
              - pattern: "¿A qué hora te levantas?"
            activities:
              - { type: learn, count: 2 }
              - { type: word_bank, count: 2 }
              - { type: fill_blank, count: 2 }
              - { type: image_select }
              - { type: translate }
          - id: present-regular
            title: Every Day (Present -ar, -er, -ir)
            description: Regular verbs in the present tense.
            vocabulary: [trabajar, comer, vivir, siempre, normalmente, "a veces", nunca, "todos los días"]
            grammar:
              - pattern: "Trabajo todos los días."
              - pattern: "Ella come en casa."
              - pattern: "Vivimos en Madrid."
              - pattern: "Él nunca bebe café."
            activities:
              - { type: learn, count: 2 }
              - { type: fill_blank, count: 3 }
              - { type: error_correct, count: 2 }
              - { type: word_bank }

      - id: home
        title: At Home
        description: Rooms, furniture and where things are.
        icon: 🏠
        steps:
          - id: rooms
            title: Rooms
            vocabulary: ["la casa", "el piso", "la cocina", "el dormitorio", "el baño", "el salón", "el jardín"]
            activities:
              - { type: learn, count: 2 }
              - { type: image_select, count: 2 }
              - { type: match }
              - { type: listen_select }
          - id: furniture
            title: Furniture
            vocabulary: ["la mesa", "la silla", "la cama", "el sofá", "la puerta", "la ventana", "la lámpara"]
            activities:
              - { type: learn, count: 2 }
              - { type: word_select, count: 2 }
              - { type: image_select }
              - { type: listen_type }
          - id: hay
            title: There Is / There Are (Hay)
            description: Say what there is in a place with hay.
            vocabulary: [hay, "no hay", muchos, muchas, pocos, "¿cuántos?"]
            grammar:
              - pattern: "Hay un sofá en el salón."
              - pattern: "Hay dos sillas."
              - pattern: "¿Hay jardín?"
            activities:
              - { type: learn }
              - { type: fill_blank, count: 3 }
              - { type: word_bank, count: 2 }
              - { type: error_correct }
          - id: prepositions-of-place
            title: Where Is It? (Estar + Place)
            description: Use estar with en, encima de, debajo de… to say where things are.
            vocabulary: [en, "encima de", "debajo de", "al lado de", "detrás de", "delante de"]
            grammar:
              - pattern: "El gato está debajo de la mesa."
              - pattern: "¿Dónde están las llaves?"
            activities:
              - { type: learn, count: 2 }
              - { type: image_select, count: 2 }
              - { type: sentence_complete, count: 2 }
              - { type: translate }

      - id: around-town
        title: Around Town
        description: Places, directions, transport and shopping.
        icon: 🏙️
        steps:
          - id: places-in-town
            title: Places in Town
            vocabulary: ["el banco", "el supermercado", "la estación", "el hospital", "el parque", "el colegio", "el museo", "la farmacia"]
            activities:
              - { type: learn, count: 3 }
              - { type: image_select, count: 2 }
              - { type: match }
              - { type: listen_select }
          - id: directions
            title: Asking for Directions
            vocabulary: [izquierda, derecha, "todo recto", cerca, lejos, "la esquina", "la calle"]
            grammar:
              - pattern: "Perdón, ¿dónde está la estación?"
              - pattern: "Gira a la izquierda en la esquina."
              - pattern: "Está cerca."
            activities:
              - { type: learn, count: 2 }
              - { type: word_bank, count: 2 }
              - { type: listen_type }
              - type: dialogue
                scenario: lost_tourist
                goal: Ask a local how to get to the museum.
          - id: transport
            title: Getting Around
            description: Go places with ir a / al and en + transport.
            vocabulary: ["el autobús", "el tren", "el taxi", "la bici", "el coche", "el billete", "a pie"]
            grammar:
              - pattern: "Voy al trabajo en autobús."
              - pattern: "Voy a la estación a pie."
            activities:
              - { type: learn, count: 2 }
              - { type: image_select, count: 2 }
              - { type: fill_blank, count: 2 }
              - { type: translate }
          - id: shopping
            title: Shopping
            description: Ask prices and pay, using poder + infinitive.
            vocabulary: [comprar, "la tienda", barato, caro, "la talla", "el dinero", pagar]
            grammar:
              - pattern: "¿Puedo pagar con tarjeta?"
              - pattern: "¿Cuánto cuesta?"
              - pattern: "Es demasiado caro."
            activities:
              - { type: learn, count: 2 }
              - { type: sentence_complete, count: 2 }
              - { type: listen_select }
              - type: dialogue
                scenario: clothes_shop
                goal: Ask for a different size and pay.

      - id: free-time
        title: Free Time
        description: Hobbies, sports and what you can do.
        icon: ⚽
        steps:
          - id: hobbies
            title: Hobbies
            vocabulary: [leer, "la música", "la película", cocinar, bailar, pintar, viajar]
            grammar:
              - pattern: "Me gusta leer."
            activities:
              - { type: learn, count: 3 }
              - { type: image_select, count: 2 }
              - { type: match }
              - { type: listen_select }
          - id: sports
            title: Sports
            vocabulary: ["el fútbol", "el tenis", nadar, correr, jugar, "el equipo", "el partido"]
            grammar:
              - pattern: "Juego al fútbol los sábados."
              - pattern: "¿Juegas al tenis?"
            activities:
              - { type: learn, count: 2 }
              - { type: word_select, count: 2 }
              - { type: fill_blank, count: 2 }
              - { type: translate }
          - id: saber-poder
            title: I Can (Saber & Poder)
            description: Say what you know how to do (saber) and what you can do (poder).
            vocabulary: [saber, poder, sé, puedo, bien, "un poco"]
            grammar:
              - pattern: "Sé nadar."
              - pattern: "Ella no sabe conducir."
              - pattern: "¿Puedes venir hoy?"
            activities:
              - { type: learn, count: 2 }
              - { type: multiple_choice, count: 2 }
              - { type: word_bank, count: 2 }
              - { type: error_correct, count: 2 }
              - { type: listen_type }
          - id: weekend-plans
            title: Weekend Plans
            description: Make plans with ir a + infinitive and invite with querer.
            vocabulary: [libre, ocupado, juntos, invitar, "ir a", "el cine"]
            grammar:
              - pattern: "Voy a ver una película."
              - pattern: "¿Quieres ir al cine?"
              - pattern: "¿Estás libre el domingo?"
            activities:
              - { type: learn, count: 2 }
              - { type: fill_blank, count: 2 }
              - { type: sentence_complete, count: 2 }
              - type: dialogue
                scenario: making_plans
                goal: Invite a friend to do something on the weekend and agree on a time.

      - id: weather-clothes
        title: Weather & Clothes
        description: Seasons, the weather and what people are wearing.
        icon: ☀️
        steps:
          - id: weather
            title: The Weather
            description: Talk about the weather with hace, está and hay.
            vocabulary: ["hace sol", "hace frío", "hace calor", "hace viento", llueve, nieva, "está nublado"]
            grammar:
              - pattern: "Hoy hace sol."
              - pattern: "¿Qué tiempo hace?"
            activities:
              - { type: learn, count: 2 }
              - { type: image_select, count: 3 }
              - { type: listen_select }
          - id: seasons-months
            title: Seasons & Months
            vocabulary: ["la primavera", "el verano", "el otoño", "el invierno", enero, junio, diciembre, "el mes"]
            grammar:
              - pattern: "En verano hace calor."
            activities:
              - { type: learn, count: 2 }
              - { type: match }
              - { type: fill_blank, count: 2 }
              - { type: listen_type }
          - id: clothes
            title: Clothes
            vocabulary: ["la camisa", "los pantalones", "el vestido", "los zapatos", "la chaqueta", "el sombrero", llevar]
            grammar:
              - pattern: "Llevo una chaqueta azul."
            activities:
              - { type: learn, count: 2 }
              - { type: image_select, count: 2 }
              - { type: word_select }
              - { type: translate }
          - id: estar-gerundio
            title: Right Now (Estar + Gerundio)
            description: Say what is happening at the moment.
            vocabulary: [ahora, "en este momento", llevando, haciendo, lloviendo, comiendo]
            grammar:
              - pattern: "Estoy hablando por teléfono."
              - pattern: "Está lloviendo."
              - pattern: "¿Qué estás haciendo?"
            activities:
              - { type: learn }
              - { type: fill_blank, count: 3 }
              - { type: error_correct, count: 2 }
              - { type: word_bank }

      - id: yesterday
        title: Yesterday
        description: Talk about the past.
        icon: 📅
        steps:
          - id: past-regular
            title: Past Tense (-ar Verbs)
            description: The preterite of regular -ar verbs and past time words.
            vocabulary: [ayer, anoche, "la semana pasada", hablé, trabajé, compré, visité, cociné]
            grammar:
              - pattern: "Ayer trabajé en casa."
              - pattern: "¿Hablaste con tu madre?"
              - pattern: "No compré nada."
            activities:
              - { type: learn, count: 2 }
              - { type: fill_blank, count: 3 }
              - { type: word_bank, count: 2 }
              - { type: listen_select }
          - id: past-regular-er-ir
            title: Past Tense (-er, -ir Verbs)
            description: The preterite of regular -er and -ir verbs.
            vocabulary: [comí, bebí, salí, escribí, viví, "hace dos días"]
            grammar:
              - pattern: "Anoche comí pescado."
              - pattern: "¿Saliste el sábado?"
              - pattern: "Ella no bebió café."
            activities:
              - { type: learn }
              - { type: fill_blank, count: 2 }
              - { type: error_correct, count: 2 }
              - { type: translate }
          - id: past-irregular
            title: Past Tense (Irregular)
            description: Common irregular preterites like fui, hice and tuve.
            vocabulary: [fui, fuiste, fue, hice, hiciste, tuve, vi]
            grammar:
              - pattern: "Fuimos al parque."
              - pattern: "¿Qué hiciste ayer?"
              - pattern: "¿Viste el partido?"
            activities:
              - { type: learn, count: 2 }
              - { type: match }
              - { type: sentence_complete, count: 2 }
              - { type: listen_type }
          - id: last-weekend
            title: My Last Weekend
            vocabulary: ["el fin de semana pasado", divertido, aburrido, primero, luego, después]
            grammar:
              - pattern: "Primero fui al mercado y luego comí con mi familia."
            activities:
              - { type: word_bank, count: 2 }
              - { type: translate, count: 2 }
              - type: dialogue
                scenario: monday_morning_chat
                goal: Tell a colleague what you did last weekend and ask about theirs.

    checkpoint:
      title: A1 Checkpoint
      required_score: 80
      activities:
        - { type: word_select, count: 3 }
        - { type: fill_blank, count: 3 }
        - { type: listen_select, count: 3 }
        - { type: translate, count: 3 }
        - { type: dialogue }

  A2:
    title: Elementary
    description: >
      Communicate in simple, routine tasks on familiar topics and describe your background, past and plans.

    units:
      - id: jobs-work
        title: Jobs & Work
        description: Talk about jobs, workplaces and your working day.
        icon: 💼
        steps:
          - id: professions
            title: Professions
            description: Say what people do; with ser, no article before the job.
            vocabulary: [médico, médica, enfermero, enfermera, profesor, profesora, camarero, abogado, ingeniera, "el trabajo"]
            grammar:
              - pattern: "Soy enfermera."
              - pattern: "¿A qué te dedicas?"
              - pattern: "Mi hermano es abogado."
            activities:
              - { type: learn, count: 3 }
              - { type: image_select, count: 2 }
              - { type: match }
              - { type: listen_select, count: 2 }
          - id: at-work
            title: At Work
            description: Say where and as what you work.
            vocabulary: ["la oficina", "la empresa", "el hospital", "la tienda", "el jefe", "la jefa", "el compañero", "trabajar como"]
            grammar:
              - pattern: "Trabajo como camarero en un restaurante."
              - pattern: "Trabajo en una empresa grande."
              - pattern: "¿Dónde trabajas?"
            activities:
              - { type: learn, count: 2 }
              - { type: fill_blank, count: 2 }
              - { type: word_bank, count: 2 }
              - { type: translate }
          - id: how-often
            title: How Often?
            description: Frequency adverbs and expressions for routines at work.
            vocabulary: [siempre, "a menudo", "a veces", "casi nunca", nunca, "todos los días", "una vez a la semana"]
            grammar:
              - pattern: "Siempre llego a las nueve."
              - pattern: "Nunca trabajo los domingos."
              - pattern: "A veces como en la oficina."
            activities:
              - { type: learn, count: 2 }
              - { type: multiple_choice, count: 2 }
              - { type: sentence_complete, count: 2 }
              - { type: listen_type }
          - id: job-interview
            title: A Job Interview
            description: Say how long you have done something with desde and hace … que.
            vocabulary: ["la entrevista", "la experiencia", desde, "hace … que", "el sueldo", "a tiempo completo", "a tiempo parcial"]
            grammar:
              - pattern: "Trabajo aquí desde 2020."
              - pattern: "Hace tres años que estudio español."
              - pattern: "¿Cuánto tiempo hace que trabajas aquí?"
            activities:
              - { type: learn }
              - { type: fill_blank, count: 2 }
              - { type: error_correct }
              - type: dialogue
                scenario: job_interview
                goal: Answer questions about your job, your experience and how long you have worked there.

      - id: comparisons
        title: Comparisons
        description: Compare people, things and places.
        icon: ⚖️
        steps:
          - id: mas-menos-que
            title: More & Less
            description: Compare with más … que and menos … que.
            vocabulary: [alto, bajo, caro, barato, rápido, lento, "más … que", "menos … que"]
            grammar:
              - pattern: "Madrid es más grande que Sevilla."
              - pattern: "El tren es menos caro que el avión."
              - pattern: "Mi hermana es más alta que yo."
            activities:
              - { type: learn, count: 2 }
              - { type: fill_blank, count: 2 }
              - { type: word_bank, count: 2 }
              - { type: listen_select }
          - id: mejor-peor
            title: Better & Worse
            description: The irregular comparatives mejor, peor, mayor and menor.
            vocabulary: [mejor, peor, mayor, menor, bueno, malo]
            grammar:
              - pattern: "Este café es mejor que el otro."
              - pattern: "Mi hermano es mayor que yo."
              - pattern: "Hoy el tiempo está peor que ayer."
            activities:
              - { type: learn }
              - { type: multiple_choice, count: 2 }
              - { type: error_correct, count: 2 }
              - { type: translate }
          - id: tan-como
            title: As … As
            description: Equal comparisons with tan … como and tanto como.
            vocabulary: ["tan … como", "tanto como", "tanto … como", igual, parecido, diferente]
            grammar:
              - pattern: "Ana es tan simpática como su madre."
              - pattern: "No trabajo tanto como tú."
              - pattern: "Tengo tantos libros como Pedro."
            activities:
              - { type: learn, count: 2 }
              - { type: fill_blank, count: 2 }
              - { type: sentence_complete }
              - { type: listen_type }
          - id: el-mas
            title: The Best of All
            description: Superlatives with el/la más … de and -ísimo.
            vocabulary: ["el más", "la más", "el mejor", "el peor", "del mundo", carísimo, buenísimo]
            grammar:
              - pattern: "Es la ciudad más bonita de España."
              - pattern: "Es el mejor restaurante del barrio."
              - pattern: "La comida está buenísima."
            activities:
              - { type: learn }
              - { type: word_bank, count: 2 }
              - { type: translate }
              - type: dialogue
                scenario: choosing_a_city
                goal: Compare two cities with a friend and decide which one is the best to visit.

      - id: at-the-shops
        title: At the Shops
        description: Buy things, ask for sizes and colors and return items.
        icon: 🛍️
        steps:
          - id: quantities
            title: How Much & How Many
            description: Quantities and containers at the market.
            vocabulary: ["un kilo de", "medio kilo", "una docena de", "una botella de", "una lata de", "un paquete de", "¿cuánto cuesta?", "¿cuántos?"]
            grammar:
              - pattern: "Quería un kilo de tomates, por favor."
              - pattern: "¿Cuánto cuestan las naranjas?"
              - pattern: "¿Algo más?"
            activities:
              - { type: learn, count: 2 }
              - { type: image_select, count: 2 }
              - { type: match }
              - { type: listen_select, count: 2 }
          - id: este-ese-aquel
            title: This One, That One
            description: Demonstratives este, ese and aquel.
            vocabulary: [este, esta, ese, esa, aquel, aquella, estos, esos]
            grammar:
              - pattern: "¿Cuánto cuesta esta camisa?"
              - pattern: "Prefiero ese bolso."
              - pattern: "Aquellos zapatos son muy caros."
            activities:
              - { type: learn }
              - { type: multiple_choice, count: 2 }
              - { type: fill_blank, count: 2 }
              - { type: listen_type }
          - id: object-pronouns
            title: I'll Take It
            description: Direct object pronouns lo, la, los and las.
            vocabulary: [lo, la, los, las, "la talla", probarse, "me lo llevo", "el probador"]
            grammar:
              - pattern: "¿Lo tiene en azul?"
              - pattern: "Me la pruebo."
              - pattern: "Me los llevo."
            activities:
              - { type: learn, count: 2 }
              - { type: fill_blank, count: 2 }
              - { type: error_correct, count: 2 }
              - { type: word_bank }
          - id: returning-things
            title: Returning Things
            description: Return or exchange something that does not fit or does not work.
            vocabulary: [devolver, cambiar, "el tique", "el recibo", roto, "me queda grande", "me queda pequeño"]
            grammar:
              - pattern: "Quiero devolver esta chaqueta."
              - pattern: "Me queda pequeña. ¿La puedo cambiar?"
              - pattern: "Aquí tiene el tique."
            activities:
              - { type: learn }
              - { type: translate, count: 2 }
              - { type: sentence_complete }
              - type: dialogue
                scenario: shop_counter
                goal: Explain that something you bought does not fit and ask to exchange it.

      - id: health-body
        title: Health & the Body
        description: Say what hurts, see a doctor and give advice.
        icon: 🩺
        steps:
          - id: body-parts
            title: The Body
            vocabulary: ["la cabeza", "el brazo", "la mano", "la pierna", "el pie", "la espalda", "el estómago", "la garganta"]
            grammar:
              - pattern: "Tengo las manos frías."
            activities:
              - { type: learn, count: 3 }
              - { type: image_select, count: 2 }
              - { type: match }
              - { type: listen_select, count: 2 }
          - id: me-duele
            title: It Hurts
            description: Say what hurts with doler, which works like gustar.
            vocabulary: [doler, "me duele", "me duelen", "¿qué te pasa?", "estar enfermo", "estar resfriado"]
            grammar:
              - pattern: "Me duele la cabeza."
              - pattern: "Me duelen los pies."
              - pattern: "¿Te duele mucho?"
            activities:
              - { type: learn, count: 2 }
              - { type: fill_blank, count: 2 }
              - { type: error_correct, count: 2 }
              - { type: listen_type }
          - id: at-the-doctor
            title: At the Doctor
            description: Describe symptoms and understand the doctor.
            vocabulary: ["la fiebre", "la tos", "la gripe", "la receta", "la pastilla", "la farmacia", "tener fiebre"]
            grammar:
              - pattern: "Tengo fiebre y tos desde ayer."
              - pattern: "Tome una pastilla cada ocho horas."
            activities:
              - { type: learn, count: 2 }
              - { type: multiple_choice, count: 2 }
              - { type: translate }
              - type: dialogue
                scenario: doctor_visit
                goal: Tell the doctor your symptoms, say since when you have them and ask what to take.
          - id: giving-advice
            title: Giving Advice
            description: Advise someone with deberías, tienes que and the tú imperative.
            vocabulary: [deberías, "tienes que", descansa, bebe, toma, "ve al médico", "no fumes"]
            grammar:
              - pattern: "Deberías descansar más."
              - pattern: "Bebe mucha agua."
              - pattern: "Tienes que ir al médico."
            activities:
              - { type: learn }
              - { type: sentence_complete, count: 2 }
              - { type: word_bank, count: 2 }
              - { type: speak }

      - id: travel-plans
        title: Travel Plans
        description: Plan a trip, get around and book a room.
        icon: ✈️
        steps:
          - id: travel-words
            title: Travel Words
            vocabulary: ["el viaje", "la maleta", "el billete", "el pasaporte", "el vuelo", "el equipaje", "de ida y vuelta", "las vacaciones"]
            grammar:
              - pattern: "Necesito un billete de ida y vuelta."
            activities:
              - { type: learn, count: 3 }
              - { type: image_select, count: 2 }
              - { type: match }
              - { type: listen_select }
          - id: ir-a
            title: Going To
            description: Talk about plans with ir a + infinitive.
            vocabulary: ["ir a", "este verano", "el mes que viene", "la próxima semana", visitar, quedarse]
            grammar:
              - pattern: "Voy a viajar a México en julio."
              - pattern: "¿Qué vas a hacer este verano?"
              - pattern: "Nos vamos a quedar una semana."
            activities:
              - { type: learn, count: 2 }
              - { type: fill_blank, count: 2 }
              - { type: word_bank, count: 2 }
              - { type: listen_type }
          - id: airport-station
            title: At the Airport & Station
            description: Check in, find your gate and ask about delays.
            vocabulary: ["el aeropuerto", "la estación", "la puerta de embarque", "el andén", "facturar", "con retraso", "la salida", "la llegada"]
            grammar:
              - pattern: "¿A qué hora sale el tren para Barcelona?"
              - pattern: "El vuelo sale con retraso."
              - pattern: "Quiero facturar esta maleta."
            activities:
              - { type: learn, count: 2 }
              - { type: multiple_choice, count: 2 }
              - { type: listen_select, count: 2 }
              - { type: translate }
          - id: booking-hotel
            title: Booking a Hotel
            description: Ask for a room politely with quería and me gustaría.
            vocabulary: ["la habitación", individual, doble, "la reserva", "el desayuno", "la noche", "me gustaría", quería]
            grammar:
              - pattern: "Quería una habitación doble para dos noches."
              - pattern: "Me gustaría reservar una mesa."
              - pattern: "¿El desayuno está incluido?"
            activities:
              - { type: learn }
              - { type: sentence_complete, count: 2 }
              - { type: error_correct }
              - type: dialogue
                scenario: hotel_reception
                goal: Book a room for two nights, ask the price and whether breakfast is included.

      - id: the-future
        title: The Future
        description: Make predictions, promises and plans.
        icon: 🔮
        steps:
          - id: futuro-regular
            title: Future Tense (Regular)
            description: "The futuro simple: infinitive + é, ás, á, emos, éis, án."
            vocabulary: [mañana, "pasado mañana", "dentro de", "en el futuro", viajaré, hablarás, vivirá]
            grammar:
              - pattern: "Mañana hablaré con el jefe."
              - pattern: "¿Dónde vivirás el año que viene?"
              - pattern: "Dentro de dos años terminaremos la carrera."
            activities:
              - { type: learn, count: 2 }
              - { type: fill_blank, count: 3 }
              - { type: word_bank }
              - { type: listen_select }
          - id: futuro-irregular
            title: Future Tense (Irregular)
            description: Irregular futures like tendré, haré, podré and saldré.
            vocabulary: [tendré, haré, podré, saldré, vendré, diré, sabré, querré]
            grammar:
              - pattern: "Tendré más tiempo en agosto."
              - pattern: "¿Qué harás el fin de semana?"
              - pattern: "No podré venir mañana."
            activities:
              - { type: learn, count: 2 }
              - { type: match }
              - { type: error_correct, count: 2 }
              - { type: listen_type }
          - id: si-futuro
            title: If … Then
            description: Real conditions with si + present + future.
            vocabulary: [si, "si llueve", "si tengo tiempo", "si puedo", entonces]
            grammar:
              - pattern: "Si llueve, nos quedaremos en casa."
              - pattern: "Si tengo tiempo, te llamaré."
              - pattern: "¿Qué harás si no encuentras trabajo?"
            activities:
              - { type: learn }
              - { type: sentence_complete, count: 2 }
              - { type: fill_blank, count: 2 }
              - { type: translate }
          - id: hopes-plans
            title: Hopes & Plans
            description: Talk about intentions and hopes with pensar and esperar + infinitive.
            vocabulary: [pensar, esperar, "tener ganas de", "el sueño", "algún día", "el plan"]
            grammar:
              - pattern: "Pienso estudiar en el extranjero."
              - pattern: "Espero encontrar un trabajo mejor."
              - pattern: "Algún día viviré junto al mar."
            activities:
              - { type: word_bank, count: 2 }
              - { type: translate }
              - type: dialogue
                scenario: new_year_plans
                goal: Tell a friend your plans and hopes for next year and ask about theirs.

      - id: childhood
        title: When I Was a Child
        description: Describe habits and situations in the past with the imperfect.
        icon: 🧸
        steps:
          - id: imperfecto-regular
            title: The Imperfect (Regular)
            description: The imperfecto of -ar (-aba) and -er/-ir (-ía) verbs.
            vocabulary: ["cuando era niño", "de pequeño", jugaba, vivía, comía, tenía, "todos los veranos"]
            grammar:
              - pattern: "De pequeño jugaba en la calle."
              - pattern: "Vivíamos en un pueblo pequeño."
              - pattern: "¿Qué comías de niño?"
            activities:
              - { type: learn, count: 2 }
              - { type: fill_blank, count: 3 }
              - { type: word_bank }
              - { type: listen_select }
          - id: imperfecto-irregular
            title: Was, Went, Saw
            description: "The only three irregular imperfects: ser, ir and ver."
            vocabulary: [era, eras, éramos, iba, íbamos, veía, veíamos]
            grammar:
              - pattern: "Cuando era niña, iba al colegio en bici."
              - pattern: "Veíamos dibujos animados todas las tardes."
            activities:
              - { type: learn, count: 2 }
              - { type: match }
              - { type: error_correct, count: 2 }
              - { type: listen_type }
          - id: soler
            title: Used To
            description: Past habits with soler + infinitive and the imperfect.
            vocabulary: [soler, solía, "normalmente", "antes", "ya no", "todavía"]
            grammar:
              - pattern: "Antes solía levantarme muy temprano."
              - pattern: "Antes fumaba, pero ya no."
            activities:
              - { type: learn }
              - { type: multiple_choice, count: 2 }
              - { type: sentence_complete, count: 2 }
              - { type: translate }
          - id: describing-the-past
            title: Describing the Past
            description: Describe people, places and how things were.
            vocabulary: [había, tranquilo, ruidoso, tímido, travieso, "la casa de mis abuelos", "el barrio"]
            grammar:
              - pattern: "En mi barrio había un parque muy grande."
              - pattern: "Mi abuela era muy cariñosa."
            activities:
              - { type: word_bank, count: 2 }
              - { type: translate }
              - type: dialogue
                scenario: family_photos
                goal: Look at old photos with a friend and describe what your life was like as a child.

      - id: telling-stories
        title: Telling Stories
        description: Tell what happened, and what was going on when it happened.
        icon: 📖
        steps:
          - id: preterite-imperfect
            title: Preterite or Imperfect?
            description: Finished events with the preterite, background with the imperfect.
            vocabulary: ["un día", "aquel día", "hacía sol", "estaba cansado", llegué, decidí]
            grammar:
              - pattern: "Hacía sol, así que fuimos a la playa."
              - pattern: "Estaba cansado y me acosté pronto."
              - pattern: "Ayer fui al cine; antes iba todas las semanas."
            activities:
              - { type: learn, count: 2 }
              - { type: multiple_choice, count: 3 }
              - { type: fill_blank, count: 2 }
              - { type: listen_select }
          - id: estaba-cuando
            title: I Was … When
            description: An action in progress (estaba + gerundio) interrupted by an event.
            vocabulary: [estaba, "estaba durmiendo", "estaba cocinando", cuando, sonó, llamó, empezó]
            grammar:
              - pattern: "Estaba duchándome cuando sonó el teléfono."
              - pattern: "¿Qué estabas haciendo cuando te llamé?"
            activities:
              - { type: learn }
              - { type: fill_blank, count: 2 }
              - { type: error_correct, count: 2 }
              - { type: word_bank }
          - id: story-connectors
            title: And Then …
            description: Connectors that move a story along.
            vocabulary: ["de repente", mientras, "al principio", "al final", entonces, "por eso", "más tarde"]
            grammar:
              - pattern: "Mientras caminaba, empezó a llover."
              - pattern: "De repente, se apagó la luz."
              - pattern: "Al final, todo salió bien."
            activities:
              - { type: learn, count: 2 }
              - { type: sentence_complete, count: 2 }
              - { type: match }
              - { type: listen_type }
          - id: telling-a-story
            title: Tell Me What Happened
            vocabulary: ["¿qué pasó?", "¡qué susto!", "¡no me digas!", perder, encontrar, "la historia"]
            grammar:
              - pattern: "Perdí el autobús porque estaba hablando con mi vecina."
            activities:
              - { type: translate, count: 2 }
              - { type: word_bank }
              - type: dialogue
                scenario: coffee_with_a_friend
                goal: Tell a friend about something unexpected that happened to you and react to their story.

      - id: life-experiences
        title: Life Experiences
        description: Talk about what you have and haven't done.
        icon: 🌍
        steps:
          - id: preterito-perfecto
            title: Have You Ever …?
            description: The pretérito perfecto with haber + participle (-ado, -ido).
            vocabulary: [he, has, ha, hemos, han, visitado, comido, vivido]
            grammar:
              - pattern: "He visitado Perú dos veces."
              - pattern: "¿Has comido paella?"
              - pattern: "Nunca hemos vivido en el extranjero."
            activities:
              - { type: learn, count: 2 }
              - { type: fill_blank, count: 3 }
              - { type: word_bank }
              - { type: listen_select }
          - id: irregular-participles
            title: Irregular Participles
            description: Common irregular participles like hecho, visto, dicho and escrito.
            vocabulary: [hecho, visto, dicho, escrito, puesto, vuelto, abierto, roto]
            grammar:
              - pattern: "¿Has visto la última película de Almodóvar?"
              - pattern: "Todavía no he hecho los deberes."
            activities:
              - { type: learn, count: 2 }
              - { type: match }
              - { type: error_correct, count: 2 }
              - { type: listen_type }
          - id: ya-todavia
            title: Already, Not Yet, Ever
            description: Ya, todavía no, alguna vez and nunca with the perfect.
            vocabulary: [ya, "todavía no", "alguna vez", nunca, "esta semana", "hoy", "este año"]
            grammar:
              - pattern: "¿Ya has terminado?"
              - pattern: "Todavía no he llamado a mi madre."
              - pattern: "¿Has estado alguna vez en Cuba?"
            activities:
              - { type: learn }
              - { type: multiple_choice, count: 2 }
              - { type: sentence_complete, count: 2 }
              - { type: translate }
          - id: talking-experiences
            title: My Experiences
            description: Share experiences and say when they happened.
            vocabulary: ["la experiencia", "una vez", "muchas veces", increíble, "nunca jamás", probar]
            grammar:
              - pattern: "He probado muchas comidas raras."
              - pattern: "Una vez subí a un volcán."
            activities:
              - { type: word_bank, count: 2 }
              - { type: translate }
              - type: dialogue
                scenario: getting_to_know_someone
                goal: Ask someone about things they have done in their life and share your own experiences.

      - id: invitations-rules
        title: Invitations & Rules
        description: Make calls, invite people, ask permission and talk about rules.
        icon: 📞
        steps:
          - id: phone-messages
            title: Phone Calls & Messages
            description: Answer the phone and leave a message.
            vocabulary: ["¿diga?", "¿sí?", "de parte de quién", "un momento", "el mensaje", "el móvil", "llamar más tarde"]
            grammar:
              - pattern: "¿Está Laura, por favor?"
              - pattern: "¿Le puedo dejar un mensaje?"
              - pattern: "Te llamo más tarde."
            activities:
              - { type: learn, count: 2 }
              - { type: multiple_choice, count: 2 }
              - { type: listen_select, count: 2 }
              - { type: listen_type }
          - id: invitations
            title: Invitations
            description: Invite, accept and politely refuse.
            vocabulary: ["¿te apetece?", "¿quieres venir?", "¡claro!", "me encantaría", "lo siento, no puedo", quedar, "otro día"]
            grammar:
              - pattern: "¿Te apetece ir al cine el sábado?"
              - pattern: "Me encantaría, pero no puedo."
              - pattern: "¿Quedamos a las ocho?"
            activities:
              - { type: learn, count: 2 }
              - { type: word_bank, count: 2 }
              - { type: translate }
              - type: dialogue
                scenario: planning_an_evening
                goal: Invite a friend out, agree on a day and a time, or politely say no.
          - id: asking-permission
            title: Asking Permission
            description: Ask for and give permission with poder and ¿te importa si…?
            vocabulary: ["¿puedo?", "¿se puede?", "¿te importa si…?", "claro que sí", "por supuesto", "mejor no"]
            grammar:
              - pattern: "¿Puedo abrir la ventana?"
              - pattern: "¿Te importa si llego un poco tarde?"
              - pattern: "¿Se puede pagar con tarjeta?"
            activities:
              - { type: learn }
              - { type: fill_blank, count: 2 }
              - { type: sentence_complete, count: 2 }
              - { type: speak }
          - id: rules
            title: Rules
            description: Obligation and prohibition with hay que, tener que and no se puede.
            vocabulary: ["hay que", "tener que", "no se puede", "está prohibido", obligatorio, "la norma"]
            grammar:
              - pattern: "Hay que llevar el pasaporte."
              - pattern: "Aquí no se puede fumar."
              - pattern: "Tenemos que llegar a las ocho."
            activities:
              - { type: learn }
              - { type: error_correct, count: 2 }
              - { type: word_bank, count: 2 }
              - { type: translate }

